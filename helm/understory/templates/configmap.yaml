apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "understory.fullname" . }}-config
  labels:
    {{- include "understory.labels" . | nindent 4 }}
data:
  NODE_ENV: {{ .Values.backend.env.NODE_ENV | default "production" | quote }}
  PORT: {{ .Values.backend.env.PORT | default "5000" | quote }}
  HOST: {{ .Values.backend.env.HOST | default "0.0.0.0" | quote }}
  SIFALO_SANDBOX: {{ .Values.backend.env.SIFALO_SANDBOX | default "true" | quote }}
  MPESA_SANDBOX: {{ .Values.backend.env.MPESA_SANDBOX | default "true" | quote }}
