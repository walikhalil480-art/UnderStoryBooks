apiVersion: v1
kind: Secret
metadata:
  name: {{ include "understory.fullname" . }}-secret
  labels:
    {{- include "understory.labels" . | nindent 4 }}
type: Opaque
data:
  JWT_SECRET: {{ .Values.backend.secrets.JWT_SECRET | default "default-dev-secret" | b64enc | quote }}
  ADMIN_DEFAULT_PASSWORD: {{ .Values.backend.secrets.ADMIN_DEFAULT_PASSWORD | default "AdminPass2026!" | b64enc | quote }}
