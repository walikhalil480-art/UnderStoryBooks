apiVersion: v1
kind: Service
metadata:
  name: backend
  labels:
    {{- include "understory.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  type: {{ .Values.backend.service.type | default "ClusterIP" }}
  ports:
    - port: {{ .Values.backend.service.port | default 5000 }}
      targetPort: {{ .Values.backend.service.targetPort | default 5000 }}
      protocol: TCP
      name: http-api
  selector:
    {{- include "understory.backendSelectorLabels" . | nindent 4 }}
