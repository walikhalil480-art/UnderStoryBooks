apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "smartstock.fullname" . }}-backend
  labels:
    {{- include "smartstock.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  replicas: {{ .Values.backend.replicaCount | default 1 }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "smartstock.backendSelectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "smartstock.backendSelectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.backend.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.backend.securityContext | nindent 8 }}
      containers:
        - name: backend
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.backend.image.pullPolicy | default "IfNotPresent" }}
          ports:
            - name: http-api
              containerPort: 5000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "smartstock.fullname" . }}-config
            - secretRef:
                name: {{ include "smartstock.fullname" . }}-secret
          {{- if .Values.backend.probes.liveness.enabled }}
          livenessProbe:
            httpGet:
              path: {{ .Values.backend.probes.liveness.path }}
              port: http-api
            initialDelaySeconds: {{ .Values.backend.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.backend.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.backend.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.backend.probes.liveness.failureThreshold }}
          {{- end }}
          {{- if .Values.backend.probes.readiness.enabled }}
          readinessProbe:
            httpGet:
              path: {{ .Values.backend.probes.readiness.path }}
              port: http-api
            initialDelaySeconds: {{ .Values.backend.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.backend.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.backend.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.backend.probes.readiness.failureThreshold }}
          {{- end }}
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
          volumeMounts:
            {{- if .Values.backend.persistence.data.enabled }}
            - name: backend-data
              mountPath: {{ .Values.backend.persistence.data.mountPath }}
            {{- end }}
            {{- if .Values.backend.persistence.manuscripts.enabled }}
            - name: backend-manuscripts
              mountPath: {{ .Values.backend.persistence.manuscripts.mountPath }}
            {{- end }}
      volumes:
        {{- if .Values.backend.persistence.data.enabled }}
        - name: backend-data
          persistentVolumeClaim:
            claimName: {{ include "smartstock.fullname" . }}-backend-data
        {{- end }}
        {{- if .Values.backend.persistence.manuscripts.enabled }}
        - name: backend-manuscripts
          persistentVolumeClaim:
            claimName: {{ include "smartstock.fullname" . }}-backend-manuscripts
        {{- end }}
