{{- if .Values.backend.persistence.data.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "smartstock.fullname" . }}-backend-data
  labels:
    {{- include "smartstock.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  accessModes:
    - {{ .Values.backend.persistence.data.accessMode | default "ReadWriteOnce" | quote }}
  {{- if .Values.backend.persistence.data.storageClass }}
  storageClassName: {{ .Values.backend.persistence.data.storageClass | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.backend.persistence.data.size | default "1Gi" | quote }}
{{- end }}
