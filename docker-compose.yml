services:
  # ============================================================================
  # 1. Backend API Service
  # ============================================================================
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: ebaro-backend
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=5000
      - HOST=0.0.0.0
      - SIFALO_SANDBOX=${SIFALO_SANDBOX:-true}
      - MPESA_SANDBOX=${MPESA_SANDBOX:-true}
    volumes:
      - ebaro_db_data:/app/server/data
      - ebaro_manuscripts:/app/server/storage/manuscripts
    networks:
      - ebaro_net
    expose:
      - "5000"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:5000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ============================================================================
  # 2. Frontend Web Server (Reverse Proxy + SPA)
  # ============================================================================
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: ebaro-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - ebaro_net
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:80/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s

# ==============================================================================
# Persistent Named Volumes
# ==============================================================================
volumes:
  ebaro_db_data:
    name: ebaro_db_data
    driver: local
  ebaro_manuscripts:
    name: ebaro_manuscripts
    driver: local

# ==============================================================================
# Internal Bridge Network
# ==============================================================================
networks:
  ebaro_net:
    name: ebaro_network
    driver: bridge
