<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 900" width="600" height="900">
  <defs>
    <linearGradient id="bgEdu" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F766E"/>
      <stop offset="50%" stop-color="#115E59"/>
      <stop offset="100%" stop-color="#134E4A"/>
    </linearGradient>
    <radialGradient id="eduGlow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#2DD4BF" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#2DD4BF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="600" height="900" fill="url(#bgEdu)"/>
  <rect width="600" height="900" fill="url(#eduGlow)"/>

  <!-- Book Spine -->
  <rect x="0" y="0" width="30" height="900" fill="#000000" opacity="0.35"/>
  <line x1="30" y1="0" x2="30" y2="900" stroke="#000000" stroke-width="2" opacity="0.4"/>
  <line x1="32" y1="0" x2="32" y2="900" stroke="#FFFFFF" stroke-width="1" opacity="0.15"/>

  <!-- Border Frame -->
  <rect x="45" y="45" width="510" height="810" rx="8" fill="none" stroke="#2DD4BF" stroke-width="2.5" opacity="0.8"/>
  <rect x="55" y="55" width="490" height="790" rx="6" fill="none" stroke="#5EEAD4" stroke-width="1" opacity="0.45"/>

  <!-- Science / Orbit Medallion -->
  <g transform="translate(300, 420)" stroke="#2DD4BF" stroke-width="2" fill="none" opacity="0.85">
    <circle r="75"/>
    <ellipse rx="75" ry="28" transform="rotate(30)"/>
    <ellipse rx="75" ry="28" transform="rotate(-30)"/>
    <circle r="14" fill="#2DD4BF"/>
  </g>

  <!-- Publisher Header -->
  <text x="300" y="115" font-family="'Cinzel', Georgia, serif" font-size="12" font-weight="700" letter-spacing="4" fill="#2DD4BF" text-anchor="middle" opacity="0.95">
    EBARO • WAXBARASHADA &amp; CILMIGA CASRIGA AH
  </text>
  <line x1="160" y1="130" x2="440" y2="130" stroke="#2DD4BF" stroke-width="1" opacity="0.5"/>

  <!-- Category -->
  <text x="300" y="165" font-family="sans-serif" font-size="11" font-weight="700" letter-spacing="2" fill="#CCFBF1" text-anchor="middle" opacity="0.9">
    EDUCATION &amp; LEARNING
  </text>

  <!-- Title Lines -->
  <text x="300" y="240" font-family="'Cinzel', Georgia, serif" font-size="34" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">
    AQOONTA SAYNISKA
  </text>
  <text x="300" y="285" font-family="'Cinzel', Georgia, serif" font-size="32" font-weight="800" fill="#5EEAD4" text-anchor="middle" letter-spacing="1">
    IYO DUNIDA CASRIGA AH
  </text>
  <text x="300" y="325" font-family="Georgia, serif" font-style="italic" font-size="16" fill="#E2E8F0" text-anchor="middle">
    Hordhaca Fiisigiska, Bayoolajiga iyo Cilmiga Hawada
  </text>

  <!-- Subtitle Text -->
  <text x="300" y="565" font-family="Georgia, serif" font-size="15" fill="#E2E8F0" text-anchor="middle">
    Prof. Axmed Jaamac Cumar &amp; Kooxda Saynisyahanada
  </text>
  <text x="300" y="590" font-family="sans-serif" font-size="12" fill="#99F6E4" text-anchor="middle">
    Qoraal Akadeemiyadeed oo u Gaar ah Ardayda Geeska Afrika
  </text>

  <!-- Author Badge -->
  <rect x="180" y="650" width="240" height="42" rx="21" fill="#134E4A" stroke="#2DD4BF" stroke-width="1"/>
  <text x="300" y="676" font-family="'Cinzel', Georgia, serif" font-size="13" font-weight="700" fill="#2DD4BF" text-anchor="middle">
    OPEN EDUCATIONAL RESOURCE
  </text>

  <!-- Provenance Footer -->
  <text x="300" y="780" font-family="sans-serif" font-size="11" font-weight="600" fill="#E2E8F0" text-anchor="middle" opacity="0.8">
    FREE AUTHORISED EDUCATIONAL TEXTBOOK
  </text>
  <text x="300" y="802" font-family="sans-serif" font-size="10" fill="#99F6E4" text-anchor="middle">
    Somali STEM Curriculum Series • eBaro Digital Library
  </text>
</svg>
