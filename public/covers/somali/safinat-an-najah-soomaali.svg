<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 900" width="600" height="900">
  <defs>
    <linearGradient id="coverBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064E3B"/>
      <stop offset="50%" stop-color="#022C22"/>
      <stop offset="100%" stop-color="#064E3B"/>
    </linearGradient>
    <radialGradient id="centerGlow" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="600" height="900" fill="url(#coverBg)"/>
  <rect width="600" height="900" fill="url(#centerGlow)"/>

  <!-- Book Spine Embossed Shadow -->
  <rect x="0" y="0" width="30" height="900" fill="#000000" opacity="0.35"/>
  <line x1="30" y1="0" x2="30" y2="900" stroke="#000000" stroke-width="2" opacity="0.4"/>
  <line x1="32" y1="0" x2="32" y2="900" stroke="#FFFFFF" stroke-width="1" opacity="0.15"/>

  <!-- Ornate Gold Frame -->
  <rect x="45" y="45" width="510" height="810" rx="8" fill="none" stroke="#F59E0B" stroke-width="3" opacity="0.85"/>
  <rect x="55" y="55" width="490" height="790" rx="6" fill="none" stroke="#F59E0B" stroke-width="1" opacity="0.5"/>

  <!-- Islamic Geometric Medallion Motif -->
  <g transform="translate(300, 420)" stroke="#F59E0B" stroke-width="2" fill="none" opacity="0.8">
    <circle r="75"/>
    <circle r="65" stroke-dasharray="4,4"/>
    <polygon points="0,-60 42,-42 60,0 42,42 0,60 -42,42 -60,0 -42,-42"/>
    <polygon points="0,-45 45,0 0,45 -45,0" stroke-width="1.5"/>
    <circle r="12" fill="#F59E0B"/>
  </g>

  <!-- Publisher Header -->
  <text x="300" y="115" font-family="'Cinzel', Georgia, serif" font-size="13" font-weight="700" letter-spacing="4" fill="#F59E0B" text-anchor="middle" opacity="0.9">
    EBARO • CILMIGA DIINTA &amp; SHARCIYADA
  </text>
  <line x1="160" y1="130" x2="440" y2="130" stroke="#F59E0B" stroke-width="1" opacity="0.5"/>

  <!-- Category -->
  <text x="300" y="165" font-family="sans-serif" font-size="11" font-weight="700" letter-spacing="2" fill="#A7F3D0" text-anchor="middle" opacity="0.85">
    ISLAMIC JURISPRUDENCE &amp; FAITH
  </text>

  <!-- Title Lines -->
  <text x="300" y="240" font-family="'Cinzel', Georgia, serif" font-size="36" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">
    SAFIINATUL
  </text>
  <text x="300" y="285" font-family="'Cinzel', Georgia, serif" font-size="34" font-weight="800" fill="#F59E0B" text-anchor="middle" letter-spacing="1">
    NAJAAX
  </text>
  <text x="300" y="325" font-family="Georgia, serif" font-style="italic" font-size="16" fill="#E2E8F0" text-anchor="middle">
    Sharaxaadda Tiirarka Islaamka &amp; Iimaanka
  </text>

  <!-- Divider -->
  <line x1="220" y1="530" x2="380" y2="530" stroke="#F59E0B" stroke-width="1.5" opacity="0.7"/>

  <!-- Subtitle Text -->
  <text x="300" y="565" font-family="Georgia, serif" font-size="14" fill="#D1FAE5" text-anchor="middle">
    Faqiiga Sh. Saalim Binu Sumayr Al-Xadrami
  </text>
  <text x="300" y="590" font-family="sans-serif" font-size="12" fill="#9CA3AF" text-anchor="middle">
    Tarjumid &amp; Faallo: Culumada Soomaaliyeed
  </text>

  <!-- Author Badge -->
  <rect x="180" y="650" width="240" height="42" rx="21" fill="#065F46" stroke="#F59E0B" stroke-width="1"/>
  <text x="300" y="676" font-family="'Cinzel', Georgia, serif" font-size="13" font-weight="700" fill="#F59E0B" text-anchor="middle">
    EDITION AUTHORISÉE
  </text>

  <!-- Provenance Footer -->
  <text x="300" y="780" font-family="sans-serif" font-size="11" font-weight="600" fill="#E2E8F0" text-anchor="middle" opacity="0.8">
    FREE AUTHORISED RELIGIOUS STUDY EDITION
  </text>
  <text x="300" y="802" font-family="sans-serif" font-size="10" fill="#9CA3AF" text-anchor="middle">
    eBaro Horn of Africa Islamic Heritage Library
  </text>
</svg>
