  </text>
  <line x1="160" y1="130" x2="440" y2="130" stroke="#FBBF24" stroke-width="1" opacity="0.5"/>

  <!-- Category -->
  <text x="300" y="165" font-family="sans-serif" font-size="11" font-weight="700" letter-spacing="2" fill="#FECDD3" text-anchor="middle" opacity="0.9">
    SELF-DEVELOPMENT &amp; BUSINESS
  </text>

  <!-- Title Lines -->
  <text x="300" y="240" font-family="'Cinzel', Georgia, serif" font-size="34" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">
