  <rect x="180" y="650" width="240" height="42" rx="21" fill="#881337" stroke="#FBBF24" stroke-width="1"/>
  <text x="300" y="676" font-family="'Cinzel', Georgia, serif" font-size="13" font-weight="700" fill="#FBBF24" text-anchor="middle">
