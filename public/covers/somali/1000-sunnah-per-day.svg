<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 900" width="600" height="900">
  <defs>
    <linearGradient id="sunnahBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#042F2E"/>
      <stop offset="30%" stop-color="#064E3B"/>
      <stop offset="70%" stop-color="#022C22"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <radialGradient id="sunnahGlow" cx="50%" cy="42%" r="55%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.28"/>
      <stop offset="50%" stop-color="#10B981" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <pattern id="islamicGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 40 20 L 20 40 L 0 20 Z" fill="none" stroke="#F59E0B" stroke-width="0.5" opacity="0.12"/>
      <circle cx="20" cy="20" r="2" fill="#F59E0B" opacity="0.15"/>
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="600" height="900" fill="url(#sunnahBg)"/>
  <rect width="600" height="900" fill="url(#islamicGrid)"/>
  <rect width="600" height="900" fill="url(#sunnahGlow)"/>

  <!-- Book Spine Embossed Shadow -->
  <rect x="0" y="0" width="30" height="900" fill="#000000" opacity="0.4"/>
  <line x1="30" y1="0" x2="30" y2="900" stroke="#000000" stroke-width="2" opacity="0.4"/>
  <line x1="32" y1="0" x2="32" y2="900" stroke="#FFFFFF" stroke-width="1" opacity="0.12"/>

  <!-- Ornate Double Gold Border -->
  <rect x="42" y="42" width="516" height="816" rx="8" fill="none" stroke="#F59E0B" stroke-width="2.5" opacity="0.9"/>
  <rect x="52" y="52" width="496" height="796" rx="6" fill="none" stroke="#F59E0B" stroke-width="1" opacity="0.45"/>

  <!-- Corner Arabesque Accents -->
  <g fill="none" stroke="#F59E0B" stroke-width="1.5" opacity="0.8">
    <path d="M 42 70 L 70 70 L 70 42"/>
    <circle cx="70" cy="70" r="3" fill="#F59E0B"/>
    <path d="M 558 70 L 530 70 L 530 42"/>
    <circle cx="530" cy="70" r="3" fill="#F59E0B"/>
    <path d="M 42 830 L 70 830 L 70 858"/>
    <circle cx="70" cy="830" r="3" fill="#F59E0B"/>
    <path d="M 558 830 L 530 830 L 530 858"/>
    <circle cx="530" cy="830" r="3" fill="#F59E0B"/>
  </g>

  <!-- Header Branding -->
  <text x="300" y="105" font-family="'Cinzel', Georgia, serif" font-size="12" font-weight="700" letter-spacing="4" fill="#F59E0B" text-anchor="middle" opacity="0.95">
    EBARO • CILMIGA DIINTA &amp; SUNNADA
  </text>
  <line x1="160" y1="120" x2="440" y2="120" stroke="#F59E0B" stroke-width="1" opacity="0.5"/>
  <text x="300" y="148" font-family="sans-serif" font-size="11" font-weight="700" letter-spacing="2.5" fill="#6EE7B7" text-anchor="middle" opacity="0.9">
    PROPHETIC SUNNAH &amp; DAILY ADHKAR
  </text>

  <!-- Main Title -->
  <text x="300" y="215" font-family="'Cinzel', Georgia, serif" font-size="44" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">
    1000 SUNNAH
  </text>
  <text x="300" y="260" font-family="'Cinzel', Georgia, serif" font-size="30" font-weight="800" fill="#F59E0B" text-anchor="middle" letter-spacing="3">
    PER DAY &amp; NIGHT
  </text>
  <text x="300" y="295" font-family="Georgia, serif" font-style="italic" font-size="16" fill="#D1FAE5" text-anchor="middle">
    In Ka Badan 1000 Sunno Maalintii iyo Habeenkii
  </text>

  <!-- Islamic Eight-Point Star Geometric Medallion -->
  <g transform="translate(300, 425)" stroke="#F59E0B" stroke-width="2" fill="none" opacity="0.85">
    <circle r="85" stroke-dasharray="2,5" stroke-width="1.5" opacity="0.6"/>
    <circle r="72"/>
    <!-- 8-point star (2 overlapping squares) -->
    <rect x="-48" y="-48" width="96" height="96" fill="rgba(245, 158, 11, 0.08)"/>
    <rect x="-48" y="-48" width="96" height="96" transform="rotate(45)" fill="rgba(245, 158, 11, 0.08)"/>
    <circle r="30" stroke="#10B981" stroke-width="1.5"/>
    <circle r="14" fill="#F59E0B"/>
    <circle r="6" fill="#042F2E"/>
  </g>

  <!-- Central Subtitle / Callout -->
  <line x1="200" y1="540" x2="400" y2="540" stroke="#F59E0B" stroke-width="1.5" opacity="0.6"/>
  <text x="300" y="570" font-family="sans-serif" font-size="11" font-weight="700" letter-spacing="3" fill="#FDE68A" text-anchor="middle">
    XUQUUQDA SHAHSIGA &amp; DULQAADKA NABAWI
  </text>
  <text x="300" y="598" font-family="Georgia, serif" font-size="14" fill="#CBD5E1" text-anchor="middle" font-style="italic">
    Sunnooyinka Weyzada, Salaadda, Hurdada iyo Ducada
  </text>

  <!-- Author &amp; Translator Box -->
  <rect x="100" y="650" width="400" height="110" rx="6" fill="rgba(6, 78, 59, 0.55)" stroke="#F59E0B" stroke-width="1" opacity="0.9"/>
  <text x="300" y="682" font-family="sans-serif" font-size="11" font-weight="600" letter-spacing="2" fill="#94A3B8" text-anchor="middle">
    QORAA:
  </text>
  <text x="300" y="708" font-family="'Cinzel', Georgia, serif" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">
    Sheekh Khaalid Al-Xuseynaan
  </text>
  <text x="300" y="736" font-family="Georgia, serif" font-style="italic" font-size="13" fill="#A7F3D0" text-anchor="middle">
    Turjumidda: C/Qaadir Sh. Maxamed Akhii
  </text>

  <!-- Footer Seal -->
  <line x1="120" y1="795" x2="480" y2="795" stroke="#F59E0B" stroke-width="1" opacity="0.4"/>
  <text x="300" y="822" font-family="sans-serif" font-size="10" font-weight="700" letter-spacing="2" fill="#F59E0B" text-anchor="middle" opacity="0.85">
    EBARO HORN OF AFRICA ISLAMIC HERITAGE • FREE OPEN ACCESS
  </text>
</svg>
