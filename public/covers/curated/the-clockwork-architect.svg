<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 900" width="600" height="900">
  <defs>
    <linearGradient id="clockBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064E3B"/>
      <stop offset="40%" stop-color="#022C22"/>
      <stop offset="80%" stop-color="#0B1C17"/>
      <stop offset="100%" stop-color="#05100D"/>
    </linearGradient>
    <radialGradient id="brassGlow" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="600" height="900" fill="url(#clockBg)"/>
  <rect width="600" height="900" fill="url(#brassGlow)"/>

  <!-- Book Spine Crease -->
  <rect x="0" y="0" width="32" height="900" fill="#000000" opacity="0.45"/>
  <line x1="32" y1="0" x2="32" y2="900" stroke="#000000" stroke-width="2" opacity="0.5"/>
  <line x1="34" y1="0" x2="34" y2="900" stroke="#FFFFFF" stroke-width="1" opacity="0.12"/>

  <!-- Ornate Double Frame -->
  <rect x="44" y="44" width="512" height="812" rx="6" fill="none" stroke="#F59E0B" stroke-width="1.8" opacity="0.75"/>
  <rect x="52" y="52" width="496" height="796" rx="4" fill="none" stroke="#10B981" stroke-width="0.8" opacity="0.5"/>

  <!-- Clockwork Gear Motif -->
  <g fill="none" stroke="#F59E0B" stroke-width="1.8" opacity="0.7" transform="translate(300, 450)">
    <circle r="80"/>
    <circle r="60" stroke-dasharray="4,4"/>
    <circle r="30" stroke="#10B981"/>
    <!-- Gear teeth -->
    <rect x="-8" y="-90" width="16" height="180" fill="rgba(245, 158, 11, 0.2)"/>
    <rect x="-8" y="-90" width="16" height="180" transform="rotate(45)" fill="rgba(245, 158, 11, 0.2)"/>
    <rect x="-8" y="-90" width="16" height="180" transform="rotate(90)" fill="rgba(245, 158, 11, 0.2)"/>
    <rect x="-8" y="-90" width="16" height="180" transform="rotate(135)" fill="rgba(245, 158, 11, 0.2)"/>
    <circle r="12" fill="#F59E0B"/>
  </g>

  <!-- Kicker -->
  <text x="300" y="110" font-family="'Cinzel', 'Plus Jakarta Sans', serif" font-size="12" font-weight="700" letter-spacing="4" fill="#FDE68A" text-anchor="middle">
    EBARO SPECULATIVE FICTION
  </text>
  <line x1="180" y1="125" x2="420" y2="125" stroke="#F59E0B" stroke-width="1" opacity="0.6"/>
  <text x="300" y="150" font-family="sans-serif" font-size="10" font-weight="800" letter-spacing="2.5" fill="#A7F3D0" text-anchor="middle">
    THE GUILD OF IRON &amp; CELESTIAL TOWERS
  </text>

  <!-- Title -->
  <text x="300" y="225" font-family="'Plus Jakarta Sans', sans-serif" font-size="34" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">
    THE CLOCKWORK
  </text>
  <text x="300" y="270" font-family="'Plus Jakarta Sans', sans-serif" font-size="36" font-weight="900" fill="#F59E0B" text-anchor="middle" letter-spacing="2">
    ARCHITECT
  </text>
  <text x="300" y="300" font-family="Georgia, serif" font-style="italic" font-size="15" fill="#E2E8F0" text-anchor="middle">
    A Masterpiece of Victorian Calculus &amp; Iron
  </text>

  <!-- Author Box -->
  <rect x="130" y="620" width="340" height="90" rx="8" fill="rgba(6, 78, 59, 0.85)" stroke="#F59E0B" stroke-width="1.2"/>
  <text x="300" y="652" font-family="sans-serif" font-size="11" font-weight="700" letter-spacing="2.5" fill="#FDE68A" text-anchor="middle">
    AUTHOR
  </text>
  <text x="300" y="682" font-family="'Plus Jakarta Sans', sans-serif" font-size="22" font-weight="800" fill="#FFFFFF" text-anchor="middle">
    Arthur Pendelton
  </text>

  <!-- Footer -->
  <line x1="150" y1="770" x2="450" y2="770" stroke="#047857" stroke-width="1"/>
  <text x="300" y="800" font-family="sans-serif" font-size="11" font-weight="700" letter-spacing="3" fill="#E2E8F0" text-anchor="middle">
    UNABRIDGED • COMPLETE NOVEL
  </text>
  <text x="300" y="825" font-family="sans-serif" font-size="9" font-weight="600" letter-spacing="2" fill="#94A3B8" text-anchor="middle">
    FOLIO SPECULATIVE IMPRINT
  </text>
</svg>
