<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 900" width="600" height="900">
  <defs>
    <linearGradient id="oliveBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141E15"/>
      <stop offset="40%" stop-color="#1C281E"/>
      <stop offset="80%" stop-color="#0F1710"/>
      <stop offset="100%" stop-color="#090E0A"/>
    </linearGradient>
    <radialGradient id="oliveGlow" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="600" height="900" fill="url(#oliveBg)"/>
  <rect width="600" height="900" fill="url(#oliveGlow)"/>

  <!-- Book Spine Crease -->
  <rect x="0" y="0" width="32" height="900" fill="#000000" opacity="0.45"/>
  <line x1="32" y1="0" x2="32" y2="900" stroke="#000000" stroke-width="2" opacity="0.5"/>
  <line x1="34" y1="0" x2="34" y2="900" stroke="#FFFFFF" stroke-width="1" opacity="0.12"/>

  <!-- Ornate Border -->
  <rect x="44" y="44" width="512" height="812" rx="6" fill="none" stroke="#34D399" stroke-width="1.5" opacity="0.5"/>
  <rect x="52" y="52" width="496" height="796" rx="4" fill="none" stroke="#E2E8F0" stroke-width="0.8" opacity="0.3"/>

  <!-- Olive Branch / Leaf Geometric Motif -->
  <g fill="none" stroke="#34D399" stroke-width="1.5" opacity="0.6" transform="translate(300, 450)">
    <circle r="75" stroke-dasharray="3,3"/>
    <path d="M 0,-50 C 30,-20 30,20 0,50 C -30,20 -30,-20 0,-50 Z"/>
    <line x1="0" y1="-50" x2="0" y2="50"/>
    <circle cx="0" cy="0" r="10" fill="#10B981"/>
    <circle cx="-35" cy="-15" r="5" fill="#34D399"/>
    <circle cx="35" cy="15" r="5" fill="#34D399"/>
  </g>

  <!-- Kicker -->
  <text x="300" y="110" font-family="'Cinzel', 'Plus Jakarta Sans', serif" font-size="12" font-weight="700" letter-spacing="4" fill="#6EE7B7" text-anchor="middle">
    EBARO NOIR &amp; MEDITERRANEAN
  </text>
  <line x1="180" y1="125" x2="420" y2="125" stroke="#10B981" stroke-width="1" opacity="0.6"/>
  <text x="300" y="150" font-family="sans-serif" font-size="10" font-weight="800" letter-spacing="2.5" fill="#D1FAE5" text-anchor="middle">
    ITALIAN LITERARY PRIZE FINALIST
  </text>

  <!-- Title -->
  <text x="300" y="225" font-family="'Plus Jakarta Sans', sans-serif" font-size="34" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">
    SHADOWS IN THE
  </text>
  <text x="300" y="270" font-family="'Plus Jakarta Sans', sans-serif" font-size="36" font-weight="900" fill="#34D399" text-anchor="middle" letter-spacing="2">
    OLIVE GROVE
  </text>
  <text x="300" y="300" font-family="Georgia, serif" font-style="italic" font-size="15" fill="#CBD5E1" text-anchor="middle">
    Bloodlines and Forgotten Sun in Apulia
  </text>

  <!-- Author Box -->
  <rect x="130" y="620" width="340" height="90" rx="8" fill="rgba(20, 30, 21, 0.8)" stroke="#10B981" stroke-width="1.2"/>
  <text x="300" y="652" font-family="sans-serif" font-size="11" font-weight="700" letter-spacing="2.5" fill="#A7F3D0" text-anchor="middle">
    AUTHOR
  </text>
  <text x="300" y="682" font-family="'Plus Jakarta Sans', sans-serif" font-size="22" font-weight="800" fill="#FFFFFF" text-anchor="middle">
    Matteo Bellini
  </text>

  <!-- Footer -->
  <line x1="150" y1="770" x2="450" y2="770" stroke="#334155" stroke-width="1"/>
  <text x="300" y="800" font-family="sans-serif" font-size="11" font-weight="700" letter-spacing="3" fill="#CBD5E1" text-anchor="middle">
    UNABRIDGED • CRITICAL EDITION
  </text>
  <text x="300" y="825" font-family="sans-serif" font-size="9" font-weight="600" letter-spacing="2" fill="#64748B" text-anchor="middle">
    EBARO MEDITERRANEAN ARCHIVE
  </text>
</svg>
