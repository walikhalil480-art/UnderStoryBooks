<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 900" width="600" height="900">
  <defs>
    <linearGradient id="literaryBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="50%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>

    <linearGradient id="coralGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="40%" stop-color="#BAE6FD"/>
      <stop offset="80%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>

    <radialGradient id="lampGlow" cx="50%" cy="36%" r="46%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background Base -->
  <rect width="600" height="900" fill="url(#literaryBg)"/>
  <rect width="600" height="900" fill="url(#lampGlow)"/>

  <!-- Spine Shadow -->
  <rect x="0" y="0" width="28" height="900" fill="#000000" opacity="0.4"/>
  <line x1="28" y1="0" x2="28" y2="900" stroke="#38BDF8" stroke-width="1" opacity="0.3"/>

  <!-- Ornate Border Frame -->
  <rect x="42" y="42" width="516" height="816" rx="6" fill="none" stroke="#38BDF8" stroke-width="2.5" opacity="0.85"/>
  <rect x="52" y="52" width="496" height="796" rx="4" fill="none" stroke="#38BDF8" stroke-width="1" stroke-dasharray="6,4" opacity="0.4"/>

  <!-- Corner Flourishes -->
  <g stroke="#38BDF8" stroke-width="2" fill="none" opacity="0.9">
    <path d="M 62,82 L 62,62 L 82,62"/>
    <circle cx="62" cy="62" r="3" fill="#38BDF8"/>
    <path d="M 538,82 L 538,62 L 518,62"/>
    <circle cx="538" cy="62" r="3" fill="#38BDF8"/>
    <path d="M 62,818 L 62,838 L 82,838"/>
    <circle cx="62" cy="838" r="3" fill="#38BDF8"/>
    <path d="M 538,818 L 538,838 L 518,838"/>
    <circle cx="538" cy="838" r="3" fill="#38BDF8"/>
  </g>

  <!-- Header Banner -->
  <text x="300" y="110" font-family="'Cinzel', 'Georgia', serif" font-size="12" font-weight="700" letter-spacing="5" fill="#38BDF8" text-anchor="middle" opacity="0.95">
    EBARO • ESSENTIALS FOR NEW READERS
  </text>
  <line x1="160" y1="126" x2="440" y2="126" stroke="#38BDF8" stroke-width="1" opacity="0.5"/>

  <!-- Central Emblem: The Open Book & Horizon of Thought -->
  <g transform="translate(300, 260)" stroke="#38BDF8" stroke-width="2" fill="none">
    <circle cx="0" cy="0" r="64" stroke-width="1.5" stroke-dasharray="5,4"/>
    <circle cx="0" cy="0" r="56" stroke-width="2"/>
    <!-- Stylized Open Book Graphic -->
    <path d="M 0,22 C -18,12 -36,14 -42,3 M 0,22 C 18,12 36,14 42,3 M 0,-24 L 0,22 M -42,-18 C -36,-7 -18,-9 0,2 M 42,-18 C 36,-7 18,-9 0,2" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Rising Sun of Imagination -->
    <circle cx="0" cy="-14" r="7" fill="#38BDF8"/>
  </g>

  <!-- Title Block -->
  <text x="300" y="395" font-family="'Cinzel', 'Georgia', serif" font-size="28" font-weight="900" letter-spacing="3" fill="#FFFFFF" text-anchor="middle">
    HOW SHOULD ONE
  </text>
  <text x="300" y="445" font-family="'Cinzel', 'Georgia', serif" font-size="38" font-weight="900" letter-spacing="5" fill="url(#coralGold)" text-anchor="middle">
    READ A BOOK?
  </text>

  <!-- Divider Line -->
  <line x1="200" y1="485" x2="400" y2="485" stroke="#38BDF8" stroke-width="2"/>
  <polygon points="300,479 306,485 300,491 294,485" fill="#38BDF8"/>

  <!-- Subtitle -->
  <text x="300" y="522" font-family="'Georgia', serif" font-style="italic" font-size="16" fill="#BAE6FD" text-anchor="middle" opacity="0.95">
    A Guide on Curiosity, Joy &amp; Independent Thought
  </text>

  <!-- Woolf's famous quote -->
  <text x="300" y="575" font-family="'Georgia', serif" font-style="italic" font-size="13" fill="#E2E8F0" text-anchor="middle">
    &quot;The only advice that one person can give another about
  </text>
  <text x="300" y="598" font-family="'Georgia', serif" font-style="italic" font-size="13" fill="#E2E8F0" text-anchor="middle">
    reading is to take no advice, to follow your own instincts,
  </text>
  <text x="300" y="621" font-family="'Georgia', serif" font-style="italic" font-size="13" fill="#E2E8F0" text-anchor="middle">
    to use your own reason, to come to your own conclusions.&quot;
  </text>

  <text x="300" y="658" font-family="sans-serif" font-size="11" fill="#94A3B8" text-anchor="middle" letter-spacing="1">
    Concise Masterpiece for First-Time &amp; Lifelong Readers • 52 Pages
  </text>

  <!-- Author Attribution -->
  <g transform="translate(0, 725)">
    <text x="300" y="0" font-family="sans-serif" font-size="11" font-weight="600" letter-spacing="4" fill="#94A3B8" text-anchor="middle">
      A U T H O R
    </text>
    <text x="300" y="32" font-family="'Cinzel', 'Georgia', serif" font-size="24" font-weight="800" letter-spacing="3" fill="#FFFFFF" text-anchor="middle">
      VIRGINIA WOOLF
    </text>
    <text x="300" y="58" font-family="sans-serif" font-size="12" fill="#38BDF8" text-anchor="middle" opacity="0.9">
      Authorized Centennial Edition • 1926
    </text>
  </g>

  <!-- Bottom Imprint -->
  <line x1="180" y1="815" x2="420" y2="815" stroke="#38BDF8" stroke-width="1" opacity="0.4"/>
  <text x="300" y="835" font-family="sans-serif" font-size="9.5" font-weight="700" letter-spacing="3" fill="#64748B" text-anchor="middle">
    EBARO DIGITAL LIBRARY • THE ART OF READING
  </text>
</svg>
