<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 900" width="600" height="900">
  <defs>
    <linearGradient id="disciplinaBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B132B"/>
      <stop offset="45%" stop-color="#1C2541"/>
      <stop offset="100%" stop-color="#0B132B"/>
    </linearGradient>

    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D4AF37"/>
      <stop offset="30%" stop-color="#FFF2A1"/>
      <stop offset="70%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#AA771C"/>
    </linearGradient>

    <radialGradient id="auroraGlow" cx="50%" cy="42%" r="45%">
      <stop offset="0%" stop-color="#4F46E5" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#D4AF37" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#0B132B" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="600" height="900" fill="url(#disciplinaBg)"/>
  <rect width="600" height="900" fill="url(#auroraGlow)"/>

  <!-- Spine Shadow -->
  <rect x="0" y="0" width="28" height="900" fill="#000000" opacity="0.4"/>
  <line x1="28" y1="0" x2="28" y2="900" stroke="#D4AF37" stroke-width="1" opacity="0.3"/>

  <!-- Ornate Frame -->
  <rect x="42" y="42" width="516" height="816" rx="6" fill="none" stroke="#D4AF37" stroke-width="2.5" opacity="0.85"/>
  <rect x="52" y="52" width="496" height="796" rx="4" fill="none" stroke="#D4AF37" stroke-width="1" stroke-dasharray="8,5" opacity="0.45"/>

  <!-- Corner Anchors -->
  <g stroke="#D4AF37" stroke-width="2" fill="none" opacity="0.9">
    <path d="M 62,82 L 62,62 L 82,62"/>
    <circle cx="62" cy="62" r="3" fill="#D4AF37"/>
    <path d="M 538,82 L 538,62 L 518,62"/>
    <circle cx="538" cy="62" r="3" fill="#D4AF37"/>
    <path d="M 62,818 L 62,838 L 82,838"/>
    <circle cx="62" cy="838" r="3" fill="#D4AF37"/>
    <path d="M 538,818 L 538,838 L 518,838"/>
    <circle cx="538" cy="838" r="3" fill="#D4AF37"/>
  </g>

  <!-- Folio Header -->
  <text x="300" y="110" font-family="'Cinzel', 'Georgia', serif" font-size="12" font-weight="700" letter-spacing="5" fill="#D4AF37" text-anchor="middle" opacity="0.95">
    EBARO • MASTERWORKS OF DISCIPLINE
  </text>
  <line x1="170" y1="126" x2="430" y2="126" stroke="#D4AF37" stroke-width="1" opacity="0.5"/>

  <!-- Central Emblem: The Torch of Focus & Will -->
  <g transform="translate(300, 275)" stroke="#D4AF37" stroke-width="2" fill="none" opacity="0.95">
    <circle cx="0" cy="0" r="64" stroke-width="1.5" stroke-dasharray="5,4"/>
    <circle cx="0" cy="0" r="56" stroke-width="2"/>
    <!-- Concentric Sunburst Lines -->
    <path d="M 0,-45 L 0,-25 M 0,45 L 0,25 M -45,0 L -25,0 M 45,0 L 25,0 M -32,-32 L -18,-18 M 32,32 L 18,18 M 32,-32 L 18,-18 M -32,32 L -18,18" stroke="#D4AF37" stroke-width="1.8"/>
    <!-- Diamond of Willpower -->
    <polygon points="0,-18 18,0 0,18 -18,0" fill="#D4AF37" stroke="none"/>
  </g>

  <!-- Title Block -->
  <text x="300" y="420" font-family="'Cinzel', 'Georgia', serif" font-size="40" font-weight="900" letter-spacing="4" fill="#FFFFFF" text-anchor="middle">
    AS A MAN
  </text>
  <text x="300" y="475" font-family="'Cinzel', 'Georgia', serif" font-size="44" font-weight="900" letter-spacing="5" fill="url(#goldGradient)" text-anchor="middle">
    THINKETH
  </text>

  <!-- Decorative Divider -->
  <line x1="200" y1="515" x2="400" y2="515" stroke="#D4AF37" stroke-width="2"/>
  <polygon points="300,509 306,515 300,521 294,515" fill="#D4AF37"/>

  <!-- Core Subtitle -->
  <text x="300" y="555" font-family="'Georgia', serif" font-style="italic" font-size="16" fill="#E2E8F0" text-anchor="middle" opacity="0.9">
    The Milestone Treatise on Mind, Focus &amp; Self-Discipline
  </text>

  <!-- Famous Key Aphorism -->
  <text x="300" y="615" font-family="'Georgia', serif" font-style="italic" font-size="13" fill="#94A3B8" text-anchor="middle">
    &quot;A man is literally what he thinks, his character being the
  </text>
  <text x="300" y="635" font-family="'Georgia', serif" font-style="italic" font-size="13" fill="#94A3B8" text-anchor="middle">
    complete sum of all his thoughts.&quot;
  </text>

  <!-- Author Attribution -->
  <g transform="translate(0, 725)">
    <text x="300" y="0" font-family="sans-serif" font-size="11" font-weight="600" letter-spacing="4" fill="#94A3B8" text-anchor="middle">
      A U T H O R
    </text>
    <text x="300" y="32" font-family="'Cinzel', 'Georgia', serif" font-size="24" font-weight="800" letter-spacing="3" fill="#FFFFFF" text-anchor="middle">
      JAMES ALLEN
    </text>
    <text x="300" y="58" font-family="sans-serif" font-size="12" fill="#D4AF37" text-anchor="middle" opacity="0.9">
      Authorized Centennial Edition • 1903
    </text>
  </g>

  <!-- Bottom Imprint -->
  <line x1="180" y1="815" x2="420" y2="815" stroke="#D4AF37" stroke-width="1" opacity="0.4"/>
  <text x="300" y="835" font-family="sans-serif" font-size="9.5" font-weight="700" letter-spacing="3" fill="#64748B" text-anchor="middle">
    EBARO DIGITAL LIBRARY • TIMELESS ARCHIVE
  </text>
</svg>
