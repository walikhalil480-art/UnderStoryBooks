<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 900" width="600" height="900">
  <defs>
    <linearGradient id="kyotoBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B132B"/>
      <stop offset="40%" stop-color="#1C2541"/>
      <stop offset="80%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>
    <radialGradient id="frostGlow" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="600" height="900" fill="url(#kyotoBg)"/>
  <rect width="600" height="900" fill="url(#frostGlow)"/>

  <!-- Book Spine Crease -->
  <rect x="0" y="0" width="32" height="900" fill="#000000" opacity="0.45"/>
  <line x1="32" y1="0" x2="32" y2="900" stroke="#000000" stroke-width="2" opacity="0.5"/>
  <line x1="34" y1="0" x2="34" y2="900" stroke="#FFFFFF" stroke-width="1" opacity="0.12"/>

  <!-- Japanese Clean Frame -->
  <rect x="44" y="44" width="512" height="812" rx="4" fill="none" stroke="#38BDF8" stroke-width="1.5" opacity="0.6"/>
  <rect x="52" y="52" width="496" height="796" rx="2" fill="none" stroke="#E2E8F0" stroke-width="0.8" opacity="0.3"/>

  <!-- Zen Circle (Enso) Motif -->
  <g fill="none" stroke="#38BDF8" stroke-width="2.5" opacity="0.75" transform="translate(300, 450)">
    <circle r="75" stroke-dasharray="12,4"/>
    <circle r="50" stroke="#BAE6FD" stroke-width="1.2"/>
    <circle cx="0" cy="0" r="14" fill="#38BDF8" opacity="0.8"/>
    <!-- Snowflake points -->
    <line x1="0" y1="-35" x2="0" y2="35" stroke="#FFFFFF" stroke-width="1"/>
    <line x1="-35" y1="0" x2="35" y2="0" stroke="#FFFFFF" stroke-width="1"/>
  </g>

  <!-- Kicker -->
  <text x="300" y="110" font-family="'Cinzel', 'Plus Jakarta Sans', serif" font-size="12" font-weight="700" letter-spacing="4" fill="#BAE6FD" text-anchor="middle">
    EBARO MEMOIR &amp; PROSE
  </text>
  <line x1="180" y1="125" x2="420" y2="125" stroke="#38BDF8" stroke-width="1" opacity="0.6"/>
  <text x="300" y="150" font-family="sans-serif" font-size="10" font-weight="800" letter-spacing="2.5" fill="#E0F2FE" text-anchor="middle">
    ZEN SOLITUDE &amp; CEDAR TEMPLES
  </text>

  <!-- Title -->
  <text x="300" y="225" font-family="'Plus Jakarta Sans', sans-serif" font-size="34" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">
    WINTERING IN
  </text>
  <text x="300" y="270" font-family="'Plus Jakarta Sans', sans-serif" font-size="36" font-weight="900" fill="#38BDF8" text-anchor="middle" letter-spacing="2">
    KYOTO
  </text>
  <text x="300" y="300" font-family="Georgia, serif" font-style="italic" font-size="15" fill="#CBD5E1" text-anchor="middle">
    Essays on Stillness, Tea and the First Snow
  </text>

  <!-- Author Box -->
  <rect x="130" y="620" width="340" height="90" rx="8" fill="rgba(11, 19, 43, 0.85)" stroke="#38BDF8" stroke-width="1.2"/>
  <text x="300" y="652" font-family="sans-serif" font-size="11" font-weight="700" letter-spacing="2.5" fill="#7DD3FC" text-anchor="middle">
    AUTHOR
  </text>
  <text x="300" y="682" font-family="'Plus Jakarta Sans', sans-serif" font-size="22" font-weight="800" fill="#FFFFFF" text-anchor="middle">
    Kenjiro Takahashi
  </text>

  <!-- Footer -->
  <line x1="150" y1="770" x2="450" y2="770" stroke="#1E293B" stroke-width="1"/>
  <text x="300" y="800" font-family="sans-serif" font-size="11" font-weight="700" letter-spacing="3" fill="#BAE6FD" text-anchor="middle">
    UNABRIDGED • ILLUSTRATED ESSAYS
  </text>
  <text x="300" y="825" font-family="sans-serif" font-size="9" font-weight="600" letter-spacing="2" fill="#64748B" text-anchor="middle">
    EBARO INTERNATIONAL PROSE SERIES
  </text>
</svg>
