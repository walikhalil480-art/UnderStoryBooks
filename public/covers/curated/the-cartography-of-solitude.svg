<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 900" width="600" height="900">
  <defs>
    <linearGradient id="cartBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="40%" stop-color="#1E293B"/>
      <stop offset="80%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#090D16"/>
    </linearGradient>
    <radialGradient id="cartGlow" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#4F46E5" stop-opacity="0.25"/>
      <stop offset="60%" stop-color="#6366F1" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="600" height="900" fill="url(#cartBg)"/>
  <rect width="600" height="900" fill="url(#cartGlow)"/>

  <!-- Book Spine Crease -->
  <rect x="0" y="0" width="32" height="900" fill="#000000" opacity="0.45"/>
  <line x1="32" y1="0" x2="32" y2="900" stroke="#000000" stroke-width="2" opacity="0.5"/>
  <line x1="34" y1="0" x2="34" y2="900" stroke="#FFFFFF" stroke-width="1" opacity="0.12"/>

  <!-- Double Frame -->
  <rect x="44" y="44" width="512" height="812" rx="6" fill="none" stroke="#E2E8F0" stroke-width="1.5" opacity="0.4"/>
  <rect x="52" y="52" width="496" height="796" rx="4" fill="none" stroke="#4F46E5" stroke-width="0.8" opacity="0.5"/>

  <!-- Topographic Contour Lines Motif -->
  <g fill="none" stroke="#64748B" stroke-width="1.2" opacity="0.35">
    <ellipse cx="300" cy="460" rx="200" ry="120" stroke-dasharray="3,3"/>
    <ellipse cx="300" cy="460" rx="160" ry="95"/>
    <ellipse cx="295" cy="455" rx="120" ry="70"/>
    <ellipse cx="290" cy="450" rx="80" ry="48" stroke="#4F46E5" stroke-width="1.5" opacity="0.7"/>
    <ellipse cx="285" cy="445" rx="45" ry="26" stroke="#818CF8" stroke-width="1.5" opacity="0.8"/>
    <!-- Compass Crosshairs -->
    <line x1="140" y1="460" x2="460" y2="460" stroke="#818CF8" stroke-width="0.75" opacity="0.4"/>
    <line x1="300" y1="340" x2="300" y2="580" stroke="#818CF8" stroke-width="0.75" opacity="0.4"/>
    <circle cx="285" cy="445" r="3" fill="#818CF8" opacity="0.9"/>
  </g>

  <!-- Meridian Coordinate Labels -->
  <text x="300" y="325" font-family="monospace" font-size="10" fill="#94A3B8" letter-spacing="3" text-anchor="middle" opacity="0.7">
    50° 05' 12" N • 14° 25' 17" E
  </text>

  <!-- Kicker / Imprint -->
  <text x="300" y="110" font-family="'Cinzel', 'Plus Jakarta Sans', serif" font-size="12" font-weight="700" letter-spacing="4" fill="#A5B4FC" text-anchor="middle">
    EBARO INTERNATIONAL EDITIONS
  </text>
  <line x1="180" y1="125" x2="420" y2="125" stroke="#4F46E5" stroke-width="1" opacity="0.6"/>
  <text x="300" y="150" font-family="sans-serif" font-size="10" font-weight="800" letter-spacing="2.5" fill="#F59E0B" text-anchor="middle">
    WINNER OF THE BOOKER PRIZE 2024
  </text>

  <!-- Title -->
  <text x="300" y="225" font-family="'Plus Jakarta Sans', sans-serif" font-size="34" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">
    THE CARTOGRAPHY
  </text>
  <text x="300" y="270" font-family="'Plus Jakarta Sans', sans-serif" font-size="36" font-weight="900" fill="#818CF8" text-anchor="middle" letter-spacing="2">
    OF SOLITUDE
  </text>
  <text x="300" y="300" font-family="Georgia, serif" font-style="italic" font-size="15" fill="#CBD5E1" text-anchor="middle">
    A Novel of Memory and Geography
  </text>

  <!-- Author Badge -->
  <rect x="130" y="620" width="340" height="90" rx="8" fill="rgba(15, 23, 42, 0.75)" stroke="#4F46E5" stroke-width="1.2"/>
  <text x="300" y="652" font-family="sans-serif" font-size="11" font-weight="700" letter-spacing="2.5" fill="#94A3B8" text-anchor="middle">
    AUTHOR
  </text>
  <text x="300" y="682" font-family="'Plus Jakarta Sans', sans-serif" font-size="22" font-weight="800" fill="#FFFFFF" text-anchor="middle">
    Elena Rostova
  </text>

  <!-- Footer -->
  <line x1="150" y1="770" x2="450" y2="770" stroke="#334155" stroke-width="1"/>
  <text x="300" y="800" font-family="sans-serif" font-size="11" font-weight="700" letter-spacing="3" fill="#CBD5E1" text-anchor="middle">
    UNABRIDGED • COMPLETE CRITICAL TEXT
  </text>
  <text x="300" y="825" font-family="sans-serif" font-size="9" font-weight="600" letter-spacing="2" fill="#64748B" text-anchor="middle">
    FOLIO PRESS &amp; EBARO READING SALON
  </text>
</svg>
