<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" width="100%" height="100%">
  <defs>
    <!-- Soft warm background glow -->
    <radialGradient id="catBgGlow" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#FEF3C7" stop-opacity="0.8"/>
      <stop offset="65%" stop-color="#FFFBEB" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#FFFBEB" stop-opacity="0"/>
    </radialGradient>

    <!-- Cat body fur gradient: Warm ginger and cream tabby -->
    <linearGradient id="catFur" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EA580C"/>
      <stop offset="40%" stop-color="#F97316"/>
      <stop offset="75%" stop-color="#FB923C"/>
      <stop offset="100%" stop-color="#FDBA74"/>
    </linearGradient>

    <!-- Chest & belly cream fur -->
    <linearGradient id="creamFur" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="70%" stop-color="#FFF7ED"/>
      <stop offset="100%" stop-color="#FED7AA"/>
    </linearGradient>

    <!-- Emerald Cat Eye Gradient -->
    <radialGradient id="catEye" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#86EFAC"/>
      <stop offset="50%" stop-color="#16A34A"/>
      <stop offset="85%" stop-color="#15803D"/>
      <stop offset="100%" stop-color="#14532D"/>
    </radialGradient>

    <!-- Ear interior blush -->
    <linearGradient id="earBlush" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#FDBA74"/>
      <stop offset="50%" stop-color="#FCA5A5"/>
      <stop offset="100%" stop-color="#FECDD3"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="catShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#7C2D12" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Ambient Light -->
  <ellipse cx="200" cy="170" rx="170" ry="110" fill="url(#catBgGlow)"/>

  <!-- Soft Woven Mat ground -->
  <ellipse cx="200" cy="268" rx="160" ry="26" fill="#FDE68A" opacity="0.6"/>
  <ellipse cx="200" cy="270" rx="140" ry="20" fill="#9A3412" opacity="0.16"/>

  <g filter="url(#catShadow)">
    <!-- Curled Tail -->
    <path d="M 125,240 C 90,245 70,225 72,195 C 74,170 95,165 98,180 C 100,192 88,205 98,220 C 106,232 120,235 135,236 Z" 
          fill="url(#catFur)" stroke="#C2410C" stroke-width="2"/>
    <!-- Tail tip cream patch -->
    <path d="M 72,195 C 74,170 95,165 98,180 C 93,178 82,185 80,195 Z" fill="#FFF7ED"/>

    <!-- Hind leg / thigh -->
    <path d="M 130,220 C 115,190 120,150 155,145 C 180,140 195,165 195,210 C 195,245 160,255 135,252 C 120,250 122,235 130,220 Z" 
          fill="url(#catFur)" stroke="#C2410C" stroke-width="1.5"/>

    <!-- Main Torso / Body -->
    <path d="M 155,150 C 170,125 210,120 235,135 C 260,150 265,185 260,230 C 255,255 235,260 185,260 C 145,260 140,240 155,150 Z" 
          fill="url(#catFur)"/>

    <!-- Tabby Body Stripes -->
    <path d="M 175,135 Q 185,155 178,175" stroke="#9A3412" stroke-width="4.5" stroke-linecap="round" fill="none" opacity="0.75"/>
    <path d="M 195,132 Q 205,158 198,185" stroke="#9A3412" stroke-width="5" stroke-linecap="round" fill="none" opacity="0.75"/>
    <path d="M 215,138 Q 222,162 216,190" stroke="#9A3412" stroke-width="4.5" stroke-linecap="round" fill="none" opacity="0.75"/>

    <!-- Front Chest Cream bib -->
    <path d="M 225,145 C 245,160 255,190 250,225 C 240,255 220,258 205,258 C 215,240 220,210 215,180 C 212,165 218,152 225,145 Z" 
          fill="url(#creamFur)"/>

    <!-- Front Paws -->
    <!-- Left Front Paw -->
    <path d="M 212,210 L 210,256 C 210,263 218,266 226,266 C 234,266 238,261 238,255 L 235,210 Z" fill="#FFF7ED" stroke="#FDBA74" stroke-width="1.5"/>
    <path d="M 216,266 L 216,259 M 224,266 L 224,258 M 232,266 L 232,259" stroke="#EA580C" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Right Front Paw -->
    <path d="M 235,208 L 240,255 C 240,262 248,265 256,265 C 264,265 268,260 266,252 L 255,208 Z" fill="#FFF7ED" stroke="#FDBA74" stroke-width="1.5"/>
    <path d="M 246,265 L 246,258 M 254,265 L 254,257 M 262,265 L 262,258" stroke="#EA580C" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Hind Paw resting -->
    <ellipse cx="148" cy="255" rx="18" ry="10" fill="#FFF7ED" stroke="#FDBA74" stroke-width="1.5"/>
    <line x1="140" y1="258" x2="140" y2="252" stroke="#EA580C" stroke-width="1.5"/>
    <line x1="148" y1="260" x2="148" y2="253" stroke="#EA580C" stroke-width="1.5"/>

    <!-- CAT HEAD -->
    <!-- Back of ears -->
    <!-- Left Ear -->
    <path d="M 195,100 L 190,52 C 189,48 193,46 197,49 L 225,82 Z" fill="#EA580C" stroke="#C2410C" stroke-width="2"/>
    <path d="M 196,92 L 193,58 L 217,80 Z" fill="url(#earBlush)"/>

    <!-- Right Ear -->
    <path d="M 245,82 L 273,49 C 277,46 281,48 280,52 L 275,100 Z" fill="#EA580C" stroke="#C2410C" stroke-width="2"/>
    <path d="M 253,80 L 277,58 L 274,92 Z" fill="url(#earBlush)"/>

    <!-- Head Shape -->
    <ellipse cx="235" cy="108" rx="42" ry="36" fill="url(#catFur)" stroke="#C2410C" stroke-width="1.5"/>

    <!-- Forehead Tabby "M" mark -->
    <path d="M 220,84 L 225,96 L 235,86 L 245,96 L 250,84" stroke="#9A3412" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <line x1="235" y1="88" x2="235" y2="98" stroke="#9A3412" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Cheeks & Muzzle Cream Area -->
    <ellipse cx="223" cy="120" rx="14" ry="10" fill="#FFF7ED"/>
    <ellipse cx="247" cy="120" rx="14" ry="10" fill="#FFF7ED"/>
    <ellipse cx="235" cy="126" rx="10" ry="7" fill="#FFF7ED"/>

    <!-- Cute Pink Nose -->
    <polygon points="231,114 239,114 235,119" fill="#F472B6" stroke="#DB2777" stroke-width="1"/>

    <!-- Mouth -->
    <path d="M 231,120 Q 235,123 235,119 Q 235,123 239,120" stroke="#9A3412" stroke-width="2" fill="none" stroke-linecap="round"/>

    <!-- EYES -->
    <!-- Left Eye -->
    <ellipse cx="218" cy="104" rx="9" ry="11" fill="#FFFFFF"/>
    <ellipse cx="218" cy="104" rx="7.5" ry="9.5" fill="url(#catEye)"/>
    <!-- Vertical Pupil -->
    <ellipse cx="218" cy="104" rx="2.5" ry="7.5" fill="#0F172A"/>
    <!-- Catchlights -->
    <circle cx="216" cy="100" r="2.5" fill="#FFFFFF"/>
    <circle cx="220" cy="106" r="1.2" fill="#FFFFFF"/>

    <!-- Right Eye -->
    <ellipse cx="252" cy="104" rx="9" ry="11" fill="#FFFFFF"/>
    <ellipse cx="252" cy="104" rx="7.5" ry="9.5" fill="url(#catEye)"/>
    <!-- Vertical Pupil -->
    <ellipse cx="252" cy="104" rx="2.5" ry="7.5" fill="#0F172A"/>
    <!-- Catchlights -->
    <circle cx="250" cy="100" r="2.5" fill="#FFFFFF"/>
    <circle cx="254" cy="106" r="1.2" fill="#FFFFFF"/>

    <!-- WHISKERS (Fine, lifelike curving white whiskers) -->
    <!-- Left whiskers -->
    <path d="M 218,118 Q 185,115 155,112" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" fill="none" opacity="0.95"/>
    <path d="M 217,121 Q 180,123 152,126" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" fill="none" opacity="0.95"/>
    <path d="M 218,124 Q 185,132 158,140" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" fill="none" opacity="0.95"/>

    <!-- Right whiskers -->
    <path d="M 252,118 Q 285,115 315,112" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" fill="none" opacity="0.95"/>
    <path d="M 253,121 Q 290,123 318,126" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" fill="none" opacity="0.95"/>
    <path d="M 252,124 Q 285,132 312,140" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" fill="none" opacity="0.95"/>

    <!-- Eyebrow whiskers -->
    <path d="M 215,95 Q 200,82 190,75" stroke="#FFFFFF" stroke-width="1.4" stroke-linecap="round" fill="none" opacity="0.9"/>
    <path d="M 255,95 Q 270,82 280,75" stroke="#FFFFFF" stroke-width="1.4" stroke-linecap="round" fill="none" opacity="0.9"/>
  </g>
</svg>