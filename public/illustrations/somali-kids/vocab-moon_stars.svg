<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" width="100%" height="100%">
  <defs>
    <!-- Deep Indigo/Sapphire Somali Night Sky -->
    <linearGradient id="nightSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="50%" stop-color="#1E1B4B"/>
      <stop offset="85%" stop-color="#312E81"/>
      <stop offset="100%" stop-color="#064E3B"/>
    </linearGradient>

    <!-- Glowing Crescent Moon Gradient -->
    <radialGradient id="moonGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#FEF08A"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </radialGradient>

    <filter id="starGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#FDE047" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Deep Night Sky Backdrop -->
  <rect width="400" height="320" rx="16" fill="url(#nightSky)"/>

  <!-- RADIANT CRESCENT MOON (DAYAXA) -->
  <g transform="translate(95, 45)" filter="url(#starGlow)">
    <path d="M 50,15 A 42,42 0 1,0 80,85 A 35,35 0 1,1 50,15 Z" fill="url(#moonGlow)"/>
  </g>

  <!-- RADIANT 8-POINTED MORNING & EVENING STARS (XIDDIGAHA DHILAALAYA) -->
  <!-- Major Primary Star -->
  <g transform="translate(265, 85)" filter="url(#starGlow)">
    <path d="M 0,-28 Q 0,0 28,0 Q 0,0 0,28 Q 0,0 -28,0 Q 0,0 0,-28 Z" fill="#FFFFFF"/>
    <path d="M -14,-14 Q 0,0 14,-14 Q 0,0 14,14 Q 0,0 -14,14 Q 0,0 -14,-14 Z" fill="#FDE047" opacity="0.8"/>
    <circle cx="0" cy="0" r="4" fill="#FFFFFF"/>
  </g>

  <!-- Secondary Bright Star -->
  <g transform="translate(330, 145)" filter="url(#starGlow)">
    <path d="M 0,-20 Q 0,0 20,0 Q 0,0 0,20 Q 0,0 -20,0 Q 0,0 0,-20 Z" fill="#FFFFFF"/>
    <circle cx="0" cy="0" r="3" fill="#FDE047"/>
  </g>

  <!-- Star 3 -->
  <g transform="translate(195, 120)">
    <path d="M 0,-15 Q 0,0 15,0 Q 0,0 0,15 Q 0,0 -15,0 Q 0,0 0,-15 Z" fill="#FEF08A"/>
    <circle cx="0" cy="0" r="2" fill="#FFFFFF"/>
  </g>

  <!-- Star 4 -->
  <g transform="translate(85, 175)">
    <path d="M 0,-14 Q 0,0 14,0 Q 0,0 0,14 Q 0,0 -14,0 Q 0,0 0,-14 Z" fill="#FEF08A"/>
  </g>

  <!-- Constellation Field of Sparkling Stars -->
  <g fill="#FFFFFF" opacity="0.85">
    <circle cx="170" cy="50" r="2"/>
    <circle cx="215" cy="40" r="1.5"/>
    <circle cx="310" cy="35" r="2.5"/>
    <circle cx="360" cy="85" r="1.5"/>
    <circle cx="240" cy="165" r="2"/>
    <circle cx="140" cy="140" r="2.5"/>
    <circle cx="50" cy="110" r="1.5"/>
    <circle cx="120" cy="205" r="2"/>
    <circle cx="295" cy="195" r="1.5"/>
  </g>

  <!-- Distant Savanna Ridge Silhouetted Beneath the Night Sky -->
  <path d="M 0,250 Q 90,230 190,245 Q 290,230 400,255 L 400,320 L 0,320 Z" fill="#022C22"/>
  <path d="M -10,265 Q 120,250 240,260 Q 330,248 420,270 L 420,320 L -10,320 Z" fill="#021C16"/>

  <!-- Acacia Silhouette Under Starry Night -->
  <g transform="translate(65, 218) scale(0.65)" fill="#021C16" stroke="#021C16">
    <path d="M 30,70 L 32,32 L 15,16 M 32,35 L 48,15" stroke-width="5" stroke-linecap="round"/>
    <ellipse cx="15" cy="12" rx="26" ry="8"/>
    <ellipse cx="48" cy="10" rx="30" ry="9"/>
  </g>

  <g transform="translate(300, 228) scale(0.55)" fill="#021C16" stroke="#021C16">
    <path d="M 30,70 L 32,32 L 15,16 M 32,35 L 48,15" stroke-width="5" stroke-linecap="round"/>
    <ellipse cx="15" cy="12" rx="26" ry="8"/>
    <ellipse cx="48" cy="10" rx="30" ry="9"/>
  </g>
</svg>