<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" width="100%" height="100%">
  <defs>
    <!-- Night ambience background -->
    <radialGradient id="lanternGlow" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#FEF08A" stop-opacity="0.9"/>
      <stop offset="35%" stop-color="#F59E0B" stop-opacity="0.5"/>
      <stop offset="70%" stop-color="#7C2D12" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0"/>
    </radialGradient>

    <!-- Brass / Bronze metal gradient -->
    <linearGradient id="brassMetal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#78350F"/>
      <stop offset="25%" stop-color="#D97706"/>
      <stop offset="50%" stop-color="#FDE68A"/>
      <stop offset="75%" stop-color="#B45309"/>
      <stop offset="100%" stop-color="#451A03"/>
    </linearGradient>

    <!-- Glowing Flame Gradient -->
    <radialGradient id="lanternFlame" cx="50%" cy="60%" r="60%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="30%" stop-color="#FEF08A"/>
      <stop offset="65%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#EF4444"/>
    </radialGradient>

    <!-- Glass Chimney Reflection -->
    <linearGradient id="glassSheen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.6"/>
      <stop offset="30%" stop-color="#FFFFFF" stop-opacity="0.1"/>
      <stop offset="70%" stop-color="#FEF3C7" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.5"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="lanternShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#F59E0B" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Ambient Radiant Glow -->
  <ellipse cx="200" cy="165" rx="175" ry="120" fill="url(#lanternGlow)"/>

  <!-- Table surface shadow -->
  <ellipse cx="200" cy="275" rx="140" ry="20" fill="#451A03" opacity="0.3"/>

  <!-- LANTERN (FAYNUUS) (Filtered) -->
  <g filter="url(#lanternShadow)">
    <!-- Top Carry Handle / Wire Bail -->
    <path d="M 140,110 C 140,25 260,25 260,110" stroke="#78350F" stroke-width="4.5" stroke-linecap="round" fill="none"/>
    <rect x="185" y="20" width="30" height="10" rx="4" fill="url(#brassMetal)"/>

    <!-- Top Exhaust Vent Hood (Tiered brass canopy) -->
    <!-- Top Finial Ball -->
    <circle cx="200" cy="62" r="7" fill="url(#brassMetal)"/>
    <!-- Top Cap Dome -->
    <path d="M 175,80 C 175,70 225,70 225,80 Z" fill="url(#brassMetal)" stroke="#451A03" stroke-width="1.5"/>
    <!-- Heat Vents (Perforations) -->
    <rect x="170" y="80" width="60" height="12" rx="2" fill="url(#brassMetal)" stroke="#451A03" stroke-width="1.5"/>
    <circle cx="180" cy="86" r="2.2" fill="#451A03"/>
    <circle cx="190" cy="86" r="2.2" fill="#451A03"/>
    <circle cx="200" cy="86" r="2.2" fill="#451A03"/>
    <circle cx="210" cy="86" r="2.2" fill="#451A03"/>
    <circle cx="220" cy="86" r="2.2" fill="#451A03"/>

    <!-- Wider Middle Canopy -->
    <path d="M 160,105 L 170,92 L 230,92 L 240,105 Z" fill="url(#brassMetal)" stroke="#451A03" stroke-width="1.5"/>

    <!-- Side Tubular Air Arms (Classic hurricane lantern pipes) -->
    <!-- Left Arm -->
    <path d="M 165,98 C 120,115 120,230 160,245" stroke="url(#brassMetal)" stroke-width="8" stroke-linecap="round" fill="none"/>
    <path d="M 165,98 C 120,115 120,230 160,245" stroke="#451A03" stroke-width="8" stroke-linecap="round" fill="none" opacity="0.15"/>

    <!-- Right Arm -->
    <path d="M 235,98 C 280,115 280,230 240,245" stroke="url(#brassMetal)" stroke-width="8" stroke-linecap="round" fill="none"/>
    <path d="M 235,98 C 280,115 280,230 240,245" stroke="#451A03" stroke-width="8" stroke-linecap="round" fill="none" opacity="0.15"/>

    <!-- GLASS CHIMNEY (Bulbous center with glowing flame inside) -->
    <!-- Inner Radiant Halo -->
    <ellipse cx="200" cy="168" rx="42" ry="46" fill="#FEF08A" opacity="0.6"/>

    <!-- Kerosene Flame -->
    <path d="M 200,140 C 212,160 214,180 200,188 C 186,180 188,160 200,140 Z" fill="url(#lanternFlame)"/>
    <path d="M 200,152 C 206,165 207,178 200,184 C 193,178 194,165 200,152 Z" fill="#FFFFFF"/>

    <!-- Brass Wick Burner Base -->
    <rect x="185" y="188" width="30" height="12" rx="2" fill="url(#brassMetal)" stroke="#451A03" stroke-width="1.5"/>
    <circle cx="218" cy="194" r="3.5" fill="#B45309"/> <!-- Thumbwheel wick knob -->

    <!-- Glass Chimney Globe Contour -->
    <path d="M 175,105 C 152,145 152,185 170,210 L 230,210 C 248,185 248,145 225,105 Z" 
          fill="url(#glassSheen)" stroke="#FED7AA" stroke-width="1.5"/>

    <!-- Protective Wire Cage (Horizontal and vertical guard wires) -->
    <path d="M 160,145 Q 200,155 240,145" stroke="#78350F" stroke-width="1.8" fill="none" opacity="0.8"/>
    <path d="M 162,175 Q 200,185 238,175" stroke="#78350F" stroke-width="1.8" fill="none" opacity="0.8"/>
    <line x1="182" y1="108" x2="178" y2="208" stroke="#78350F" stroke-width="1.8" opacity="0.7"/>
    <line x1="218" y1="108" x2="222" y2="208" stroke="#78350F" stroke-width="1.8" opacity="0.7"/>

    <!-- LOWER FUEL TANK BASE (Heavy flared brass font) -->
    <!-- Collar Band -->
    <rect x="165" y="210" width="70" height="10" rx="3" fill="url(#brassMetal)" stroke="#451A03" stroke-width="1.5"/>
    <!-- Fuel Tank Font -->
    <path d="M 162,220 C 145,235 145,260 152,268 L 248,268 C 255,260 255,235 238,220 Z" 
          fill="url(#brassMetal)" stroke="#451A03" stroke-width="2"/>
    <!-- Tank Bottom Rim -->
    <ellipse cx="200" cy="268" rx="48" ry="8" fill="url(#brassMetal)" stroke="#451A03" stroke-width="2"/>

    <!-- Fuel Filler Cap with Brass Chains -->
    <circle cx="236" cy="242" r="5" fill="#F59E0B" stroke="#78350F" stroke-width="1"/>
  </g>
</svg>