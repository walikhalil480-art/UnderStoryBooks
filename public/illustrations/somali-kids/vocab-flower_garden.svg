<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" width="100%" height="100%">
  <defs>
    <!-- Background Garden Glow -->
    <radialGradient id="flowerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FEF3C7" stop-opacity="0.9"/>
      <stop offset="65%" stop-color="#FCE7F3" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#F4EFE6" stop-opacity="0"/>
    </radialGradient>

    <!-- Petal Vibrant Gradient -->
    <linearGradient id="petalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDA4AF"/>
      <stop offset="40%" stop-color="#F43F5E"/>
      <stop offset="100%" stop-color="#BE123C"/>
    </linearGradient>

    <!-- Leaf Green Gradient -->
    <linearGradient id="leafGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="60%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#064E3B"/>
    </linearGradient>

    <!-- Golden Center -->
    <radialGradient id="centerPollen" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="60%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#B45309"/>
    </radialGradient>

    <filter id="flowerShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#4C0519" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Garden Aura -->
  <ellipse cx="200" cy="160" rx="160" ry="115" fill="url(#flowerGlow)"/>

  <!-- STEM & LEAVES -->
  <g filter="url(#flowerShadow)">
    <!-- Elegant Curved Plant Stem -->
    <path d="M 200,165 Q 190,225 195,285" fill="none" stroke="#047857" stroke-width="8" stroke-linecap="round"/>
    <path d="M 198,170 Q 188,225 193,285" fill="none" stroke="#34D399" stroke-width="2" stroke-linecap="round"/>

    <!-- Left Glossy Leaf with Dewdrop -->
    <g transform="translate(192, 230) rotate(-35)">
      <path d="M 0,0 C -35,-25 -65,-10 -75,15 C -45,30 -15,15 0,0 Z" fill="url(#leafGreen)"/>
      <path d="M 0,0 Q -40,10 -72,14" stroke="#A7F3D0" stroke-width="2" fill="none"/>
      <!-- Glistening Dewdrop -->
      <circle cx="-42" cy="6" r="4.5" fill="#FFFFFF" opacity="0.85"/>
      <circle cx="-43" cy="5" r="1.5" fill="#FFFFFF"/>
    </g>

    <!-- Right Glossy Leaf -->
    <g transform="translate(196, 205) rotate(35)">
      <path d="M 0,0 C 35,-25 65,-10 75,15 C 45,30 15,15 0,0 Z" fill="url(#leafGreen)"/>
      <path d="M 0,0 Q 40,10 72,14" stroke="#A7F3D0" stroke-width="2" fill="none"/>
      <!-- Small Dewdrop -->
      <circle cx="38" cy="8" r="3.5" fill="#FFFFFF" opacity="0.85"/>
    </g>
  </g>

  <!-- BLOOMING SOMALI DESERT FLOWER PETALS (UBAX CURUUX LEH) -->
  <g transform="translate(200, 140)" filter="url(#flowerShadow)">
    <!-- 5 Radial Symmetrical Petals -->
    <!-- Petal Top (0 deg) -->
    <path d="M 0,-15 C -30,-45 -25,-90 0,-95 C 25,-90 30,-45 0,-15 Z" fill="url(#petalGrad)"/>
    <path d="M 0,-15 Q 0,-60 0,-85" stroke="#FECDD3" stroke-width="1.8" fill="none" opacity="0.75"/>

    <!-- Petal Top-Right (72 deg) -->
    <g transform="rotate(72)">
      <path d="M 0,-15 C -30,-45 -25,-90 0,-95 C 25,-90 30,-45 0,-15 Z" fill="url(#petalGrad)"/>
      <path d="M 0,-15 Q 0,-60 0,-85" stroke="#FECDD3" stroke-width="1.8" fill="none" opacity="0.75"/>
    </g>

    <!-- Petal Bottom-Right (144 deg) -->
    <g transform="rotate(144)">
      <path d="M 0,-15 C -30,-45 -25,-90 0,-95 C 25,-90 30,-45 0,-15 Z" fill="url(#petalGrad)"/>
      <path d="M 0,-15 Q 0,-60 0,-85" stroke="#FECDD3" stroke-width="1.8" fill="none" opacity="0.75"/>
    </g>

    <!-- Petal Bottom-Left (216 deg) -->
    <g transform="rotate(216)">
      <path d="M 0,-15 C -30,-45 -25,-90 0,-95 C 25,-90 30,-45 0,-15 Z" fill="url(#petalGrad)"/>
      <path d="M 0,-15 Q 0,-60 0,-85" stroke="#FECDD3" stroke-width="1.8" fill="none" opacity="0.75"/>
    </g>

    <!-- Petal Top-Left (288 deg) -->
    <g transform="rotate(288)">
      <path d="M 0,-15 C -30,-45 -25,-90 0,-95 C 25,-90 30,-45 0,-15 Z" fill="url(#petalGrad)"/>
      <path d="M 0,-15 Q 0,-60 0,-85" stroke="#FECDD3" stroke-width="1.8" fill="none" opacity="0.75"/>
    </g>

    <!-- Inner Velvet Petal Overlays -->
    <g transform="scale(0.68) rotate(36)">
      <path d="M 0,-15 C -25,-40 -20,-80 0,-85 C 20,-80 25,-40 0,-15 Z" fill="#E11D48"/>
      <g transform="rotate(72)"><path d="M 0,-15 C -25,-40 -20,-80 0,-85 C 20,-80 25,-40 0,-15 Z" fill="#E11D48"/></g>
      <g transform="rotate(144)"><path d="M 0,-15 C -25,-40 -20,-80 0,-85 C 20,-80 25,-40 0,-15 Z" fill="#E11D48"/></g>
      <g transform="rotate(216)"><path d="M 0,-15 C -25,-40 -20,-80 0,-85 C 20,-80 25,-40 0,-15 Z" fill="#E11D48"/></g>
      <g transform="rotate(288)"><path d="M 0,-15 C -25,-40 -20,-80 0,-85 C 20,-80 25,-40 0,-15 Z" fill="#E11D48"/></g>
    </g>

    <!-- Central Pollen Disc (Crown of Stamens) -->
    <circle cx="0" cy="0" r="22" fill="url(#centerPollen)"/>
    <circle cx="0" cy="0" r="18" fill="none" stroke="#FDE047" stroke-width="3" stroke-dasharray="3,3"/>

    <!-- Golden Stamen Dots -->
    <circle cx="-8" cy="-8" r="2.5" fill="#FEF08A"/>
    <circle cx="8" cy="-8" r="2.5" fill="#FEF08A"/>
    <circle cx="-8" cy="8" r="2.5" fill="#FEF08A"/>
    <circle cx="8" cy="8" r="2.5" fill="#FEF08A"/>
    <circle cx="0" cy="0" r="3.5" fill="#FEF08A"/>
  </g>

  <!-- Sweet Spring Aroma / Golden Pollen Sparkles -->
  <g fill="#F59E0B">
    <path d="M 330,85 Q 336,85 336,79 Q 336,85 342,85 Q 336,85 336,91 Q 336,85 330,85 Z"/>
    <path d="M 65,95 Q 70,95 70,90 Q 70,95 75,95 Q 70,95 70,100 Q 70,95 65,95 Z" opacity="0.8"/>
  </g>
</svg>