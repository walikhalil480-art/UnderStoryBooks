<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" width="100%" height="100%">
  <defs>
    <!-- Background Radial Soft Glow -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FEF3C7" stop-opacity="0.8"/>
      <stop offset="70%" stop-color="#F4EFE6" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#F4EFE6" stop-opacity="0"/>
    </radialGradient>

    <!-- Cover Leather Gradient -->
    <linearGradient id="coverLeather" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064E3B"/>
      <stop offset="50%" stop-color="#047857"/>
      <stop offset="100%" stop-color="#065F46"/>
    </linearGradient>

    <!-- Gold Foil Details -->
    <linearGradient id="goldFoil" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="50%" stop-color="#FDE68A"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>

    <!-- Page Gradients (Left & Right curves) -->
    <linearGradient id="pageLeft" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E2D9C8"/>
      <stop offset="15%" stop-color="#FAF7F2"/>
      <stop offset="85%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#D5CBB9"/>
    </linearGradient>

    <linearGradient id="pageRight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D5CBB9"/>
      <stop offset="15%" stop-color="#FFFFFF"/>
      <stop offset="85%" stop-color="#FAF7F2"/>
      <stop offset="100%" stop-color="#E2D9C8"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="bookShadow" x="-15%" y="-15%" width="130%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#0F172A" flood-opacity="0.18"/>
    </filter>

    <filter id="pageShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Ambient Glow -->
  <ellipse cx="200" cy="180" rx="170" ry="100" fill="url(#bgGlow)"/>

  <!-- Ground Plane Shadow -->
  <ellipse cx="200" cy="245" rx="160" ry="24" fill="#1E293B" opacity="0.12"/>

  <!-- BOOK HARDCOVER BASE (Filtered with Shadow) -->
  <g filter="url(#bookShadow)">
    <!-- Left Cover Flap -->
    <path d="M 45,215 Q 110,230 195,225 L 195,75 Q 110,80 45,65 Z" fill="url(#coverLeather)" stroke="#022C22" stroke-width="2"/>
    <!-- Right Cover Flap -->
    <path d="M 355,215 Q 290,230 205,225 L 205,75 Q 290,80 355,65 Z" fill="url(#coverLeather)" stroke="#022C22" stroke-width="2"/>
    <!-- Central Spine Base -->
    <path d="M 190,225 Q 200,228 210,225 L 210,75 Q 200,78 190,75 Z" fill="#022C22"/>
  </g>

  <!-- Gold Embossed Trim on Cover Edge -->
  <path d="M 49,69 Q 112,83 192,78" fill="none" stroke="url(#goldFoil)" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 351,69 Q 288,83 208,78" fill="none" stroke="url(#goldFoil)" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 49,211 Q 112,225 192,221" fill="none" stroke="url(#goldFoil)" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 351,211 Q 288,225 208,221" fill="none" stroke="url(#goldFoil)" stroke-width="2.5" stroke-linecap="round"/>

  <!-- STACKED UNDER-PAGES (Depth Block) -->
  <!-- Left Side Page Block -->
  <path d="M 50,208 Q 115,222 195,218 L 195,224 Q 115,228 50,214 Z" fill="#C5BBAA"/>
  <path d="M 52,204 Q 116,218 195,214 L 195,220 Q 116,224 52,210 Z" fill="#D8CFBF"/>

  <!-- Right Side Page Block -->
  <path d="M 350,208 Q 285,222 205,218 L 205,224 Q 285,228 350,214 Z" fill="#C5BBAA"/>
  <path d="M 348,204 Q 284,218 205,214 L 205,220 Q 284,224 348,210 Z" fill="#D8CFBF"/>

  <!-- OPEN TOP PAGES WITH NATURAL ARCHING -->
  <g filter="url(#pageShadow)">
    <!-- Left Main Open Page -->
    <path d="M 55,62 C 95,78 145,82 196,72 L 196,212 C 145,222 95,218 55,202 Z"
          fill="url(#pageLeft)" stroke="#E5DEC9" stroke-width="1"/>

    <!-- Right Main Open Page -->
    <path d="M 345,62 C 305,78 255,82 204,72 L 204,212 C 255,222 305,218 345,202 Z"
          fill="url(#pageRight)" stroke="#E5DEC9" stroke-width="1"/>
  </g>

  <!-- Center Gutter Shadow -->
  <path d="M 197,72 C 199,72 201,72 203,72 L 203,212 C 201,212 199,212 197,212 Z" fill="#A89F8D" opacity="0.65"/>

  <!-- Left Page Content: Calligraphic Lines & Ornamental Header -->
  <!-- Header Title bar -->
  <rect x="75" y="85" width="45" height="4" rx="2" fill="#047857" opacity="0.8"/>
  <circle cx="170" cy="87" r="3" fill="#D97706"/>

  <!-- Simulated Story Text Lines (Left Page) -->
  <line x1="75" y1="102" x2="175" y2="102" stroke="#475569" stroke-width="2" stroke-linecap="round" opacity="0.75"/>
  <line x1="75" y1="114" x2="170" y2="114" stroke="#475569" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  <line x1="75" y1="126" x2="178" y2="126" stroke="#475569" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  <line x1="75" y1="138" x2="162" y2="138" stroke="#475569" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  <line x1="75" y1="150" x2="174" y2="150" stroke="#475569" stroke-width="2" stroke-linecap="round" opacity="0.6"/>

  <!-- Left Page Illustration Vignette (Sun & Tree silhouette) -->
  <g transform="translate(75, 162)">
    <rect x="0" y="0" width="98" height="34" rx="4" fill="#F1F5F9" stroke="#E2E8F0"/>
    <circle cx="78" cy="12" r="6" fill="#F59E0B" opacity="0.85"/>
    <path d="M 18,28 L 18,16 L 12,10 M 18,18 L 24,11" stroke="#047857" stroke-width="2" stroke-linecap="round"/>
    <ellipse cx="18" cy="9" rx="14" ry="4" fill="#059669"/>
    <line x1="6" y1="28" x2="90" y2="28" stroke="#CBD5E1" stroke-width="1.5"/>
  </g>

  <!-- Right Page Content: Somali "B" Illuminated Capital & Story Passage -->
  <!-- Illuminated Drop Cap "B" -->
  <rect x="225" y="85" width="28" height="28" rx="6" fill="#047857"/>
  <text x="239" y="106" font-family="'Newsreader', Georgia, serif" font-size="20" font-weight="900" fill="#FFFFFF" text-anchor="middle">B</text>

  <!-- Text beside Drop Cap -->
  <line x1="262" y1="92" x2="325" y2="92" stroke="#475569" stroke-width="2" stroke-linecap="round" opacity="0.75"/>
  <line x1="262" y1="104" x2="320" y2="104" stroke="#475569" stroke-width="2" stroke-linecap="round" opacity="0.6"/>

  <!-- Following Paragraph Lines -->
  <line x1="225" y1="124" x2="325" y2="124" stroke="#475569" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  <line x1="225" y1="136" x2="318" y2="136" stroke="#475569" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  <line x1="225" y1="148" x2="328" y2="148" stroke="#475569" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  <line x1="225" y1="160" x2="312" y2="160" stroke="#475569" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  <line x1="225" y1="172" x2="322" y2="172" stroke="#475569" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  <line x1="225" y1="184" x2="285" y2="184" stroke="#475569" stroke-width="2" stroke-linecap="round" opacity="0.6"/>

  <!-- Page Numbers -->
  <text x="68" y="202" font-family="sans-serif" font-size="9" fill="#94A3B8" font-weight="bold">12</text>
  <text x="330" y="202" font-family="sans-serif" font-size="9" fill="#94A3B8" font-weight="bold">13</text>

  <!-- SILK RIBBON BOOKMARK FLOWING ACROSS -->
  <g filter="url(#pageShadow)">
    <!-- Ribbon Top Arch from Spine -->
    <path d="M 197,68 C 198,52 202,52 203,68 L 203,72 C 202,60 198,60 197,72 Z" fill="#B45309"/>
    <!-- Ribbon Trail Cascading Down Center & Spilling Over Bottom -->
    <path d="M 198,72 Q 192,130 206,170 Q 218,205 214,245 L 204,247 Q 207,205 196,170 Q 183,130 198,72 Z"
          fill="url(#goldFoil)"/>
    <!-- V-notched Ribbon Tail -->
    <path d="M 204,247 L 209,258 L 214,245 Z" fill="#D97706"/>
  </g>

  <!-- Sparkles of Learning (Wisdom Rays) -->
  <g fill="#F59E0B">
    <!-- Top-Right Sparkle -->
    <path d="M 330,45 Q 338,45 338,37 Q 338,45 346,45 Q 338,45 338,53 Q 338,45 330,45 Z"/>
    <!-- Top-Left Sparkle -->
    <path d="M 65,42 Q 71,42 71,36 Q 71,42 77,42 Q 71,42 71,48 Q 71,42 65,42 Z" opacity="0.85"/>
    <!-- Center Sparkle -->
    <circle cx="200" cy="46" r="2.5" fill="#F59E0B"/>
  </g>
</svg>