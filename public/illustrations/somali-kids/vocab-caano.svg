<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" width="100%" height="100%">
  <defs>
    <!-- Background Radial Soft Glow -->
    <radialGradient id="vesselGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FEF3C7" stop-opacity="0.9"/>
      <stop offset="70%" stop-color="#F4EFE6" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#F4EFE6" stop-opacity="0"/>
    </radialGradient>

    <!-- Woven Fiber Gradient (Maydhax) -->
    <linearGradient id="wovenFiber" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#78350F"/>
      <stop offset="25%" stop-color="#B45309"/>
      <stop offset="50%" stop-color="#D97706"/>
      <stop offset="75%" stop-color="#B45309"/>
      <stop offset="100%" stop-color="#78350F"/>
    </linearGradient>

    <!-- Dark Smoked Wood Base Gradient (Usha / Xabagta qiiqa) -->
    <linearGradient id="smokedWood" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2D1807"/>
      <stop offset="40%" stop-color="#582C0E"/>
      <stop offset="70%" stop-color="#783D16"/>
      <stop offset="100%" stop-color="#2D1807"/>
    </linearGradient>

    <!-- Leather Harness Straps (Harag) -->
    <linearGradient id="leatherStrap" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#991B1B"/>
      <stop offset="50%" stop-color="#7F1D1D"/>
      <stop offset="100%" stop-color="#450A0A"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="vesselShadow" x="-15%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="8" flood-color="#451A03" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background Warm Aura -->
  <ellipse cx="200" cy="165" rx="160" ry="120" fill="url(#vesselGlow)"/>

  <!-- Traditional Somali Woven Mat (Derin / Caws) Underneath -->
  <g transform="translate(70, 240)">
    <ellipse cx="130" cy="35" rx="140" ry="25" fill="#E2A662" stroke="#B45309" stroke-width="2"/>
    <!-- Concentric Woven Rings on Mat -->
    <ellipse cx="130" cy="35" rx="115" ry="19" fill="none" stroke="#92400E" stroke-width="1.5" stroke-dasharray="6,4"/>
    <ellipse cx="130" cy="35" rx="85" ry="14" fill="none" stroke="#B45309" stroke-width="1.5"/>
    <ellipse cx="130" cy="35" rx="55" ry="9" fill="none" stroke="#D97706" stroke-width="1.5" stroke-dasharray="4,3"/>
  </g>

  <!-- Vessel Ground Contact Shadow -->
  <ellipse cx="200" cy="265" rx="65" ry="16" fill="#451A03" opacity="0.35"/>

  <!-- THE DHIIL (TRADITIONAL SOMALI MILK VESSEL) -->
  <g filter="url(#vesselShadow)">
    <!-- Main Gourd/Vessel Bulbous Body -->
    <!-- Lower Belly -->
    <path d="M 148,150 C 120,195 130,245 160,265 C 180,275 220,275 240,265 C 270,245 280,195 252,150 Z"
          fill="url(#smokedWood)" stroke="#1F0E04" stroke-width="2"/>

    <!-- Upper Shoulder / Slender Waist -->
    <path d="M 162,110 C 152,125 148,138 148,150 C 180,158 220,158 252,150 C 252,138 248,125 238,110 Z"
          fill="url(#wovenFiber)" stroke="#1F0E04" stroke-width="1.5"/>

    <!-- Slender Neck of the Dhiil -->
    <path d="M 170,78 L 162,110 C 185,116 215,116 238,110 L 230,78 Z"
          fill="url(#smokedWood)" stroke="#1F0E04" stroke-width="1.5"/>

    <!-- Woven Geometric Texture Bands on Belly -->
    <!-- Band 1 -->
    <path d="M 136,175 Q 200,195 264,175" fill="none" stroke="#F59E0B" stroke-width="3" stroke-linecap="round"/>
    <path d="M 136,182 Q 200,202 264,182" fill="none" stroke="#DC2626" stroke-width="2"/>
    <!-- Triangular / Chevron Woven Motif -->
    <path d="M 140,195 L 148,185 L 156,195 L 164,185 L 172,195 L 180,185 L 188,195 L 196,185 L 204,195 L 212,185 L 220,195 L 228,185 L 236,195 L 244,185 L 252,195 L 260,185"
          fill="none" stroke="#FDE68A" stroke-width="2" stroke-linejoin="round"/>

    <!-- Band 2 (Lower Belly) -->
    <path d="M 142,215 Q 200,235 258,215" fill="none" stroke="#F59E0B" stroke-width="2.5"/>
    <path d="M 148,225 Q 200,245 252,225" fill="none" stroke="#DC2626" stroke-width="2"/>

    <!-- Woven Conical Lid / Cap (Masaf) -->
    <path d="M 160,78 Q 200,68 240,78 L 208,24 Q 200,18 192,24 Z"
          fill="url(#wovenFiber)" stroke="#1F0E04" stroke-width="2"/>

    <!-- Masaf Conical Ribs & Finial Knob -->
    <path d="M 200,22 L 175,76 M 200,22 L 200,74 M 200,22 L 225,76" stroke="#92400E" stroke-width="1.5"/>
    <circle cx="200" cy="20" r="5" fill="#DC2626" stroke="#78350F" stroke-width="1.5"/>

    <!-- LEATHER HARNESS STRAPS & SUSPENSION CORD (Harag lagu xiray) -->
    <!-- Left Vertical Harness Strap -->
    <path d="M 168,75 Q 152,160 168,262" fill="none" stroke="url(#leatherStrap)" stroke-width="4.5" stroke-linecap="round"/>
    <!-- Right Vertical Harness Strap -->
    <path d="M 232,75 Q 248,160 232,262" fill="none" stroke="url(#leatherStrap)" stroke-width="4.5" stroke-linecap="round"/>

    <!-- Brass Rivets / Cowrie Shells on Straps -->
    <ellipse cx="158" cy="130" rx="3.5" ry="5" fill="#FEF3C7" stroke="#92400E" stroke-width="1"/>
    <ellipse cx="155" cy="180" rx="4" ry="6" fill="#FEF3C7" stroke="#92400E" stroke-width="1"/>
    <ellipse cx="160" cy="230" rx="3.5" ry="5" fill="#FEF3C7" stroke="#92400E" stroke-width="1"/>

    <ellipse cx="242" cy="130" rx="3.5" ry="5" fill="#FEF3C7" stroke="#92400E" stroke-width="1"/>
    <ellipse cx="245" cy="180" rx="4" ry="6" fill="#FEF3C7" stroke="#92400E" stroke-width="1"/>
    <ellipse cx="240" cy="230" rx="3.5" ry="5" fill="#FEF3C7" stroke="#92400E" stroke-width="1"/>

    <!-- Hanging Loop / Shoulder Carrying Strap (Xadhigga lagu qaado) -->
    <path d="M 166,74 C 115,35 110,-10 200,5 C 290,-10 285,35 234,74"
          fill="none" stroke="url(#leatherStrap)" stroke-width="3" stroke-linecap="round" stroke-dasharray="6,2"/>
  </g>

  <!-- Fresh Pure White Camel Milk Drops / Steaming Wholesome Aroma -->
  <g fill="#FFFFFF" opacity="0.85">
    <circle cx="280" cy="110" r="3"/>
    <circle cx="295" cy="98" r="4"/>
    <circle cx="312" cy="85" r="5"/>
  </g>

  <!-- Sparkling Golden Stars around Cultural Emblem -->
  <g fill="#F59E0B">
    <path d="M 320,135 Q 325,135 325,130 Q 325,135 330,135 Q 325,135 325,140 Q 325,135 320,135 Z"/>
    <path d="M 75,100 Q 80,100 80,95 Q 80,100 85,100 Q 80,100 80,105 Q 80,100 75,100 Z"/>
  </g>
</svg>