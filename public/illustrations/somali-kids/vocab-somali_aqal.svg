<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" width="100%" height="100%">
  <defs>
    <!-- Warm sunset glow over savanna encampment -->
    <radialGradient id="aqalSky" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#FEF08A" stop-opacity="0.9"/>
      <stop offset="45%" stop-color="#FDBA74" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#FED7AA" stop-opacity="0"/>
    </radialGradient>

    <!-- Woven dome outer layer gradient -->
    <radialGradient id="matDome" cx="50%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#D97706"/>
      <stop offset="40%" stop-color="#B45309"/>
      <stop offset="80%" stop-color="#92400E"/>
      <stop offset="100%" stop-color="#78350F"/>
    </radialGradient>

    <!-- Doorway interior deep shadow -->
    <linearGradient id="doorInterior" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="aqalShadow" x="-15%" y="-15%" width="130%" height="135%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#451A03" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Savanna Horizon Sky -->
  <ellipse cx="200" cy="160" rx="180" ry="120" fill="url(#aqalSky)"/>

  <!-- Distant Savanna Acacia Silhouette -->
  <g opacity="0.35" transform="translate(40, 140) scale(0.65)">
    <path d="M 50,110 L 50,60 L 30,30 M 50,60 L 75,32 M 50,50 L 50,25" stroke="#78350F" stroke-width="4" stroke-linecap="round"/>
    <ellipse cx="48" cy="22" rx="42" ry="10" fill="#78350F"/>
  </g>

  <!-- Golden Savanna Encampment Sand Ground -->
  <ellipse cx="200" cy="265" rx="170" ry="26" fill="#FDE68A" opacity="0.6"/>
  <ellipse cx="200" cy="268" rx="150" ry="18" fill="#78350F" opacity="0.2"/>

  <!-- AQAL SOOMAALI DOME (Filtered) -->
  <g filter="url(#aqalShadow)">
    <!-- Main Hemispherical Dome Structure -->
    <path d="M 65,248 C 65,115 125,75 200,75 C 275,75 335,115 335,248 Z" 
          fill="url(#matDome)" stroke="#451A03" stroke-width="3"/>

    <!-- Decorative Woven Mats (Kebed / Alool) Layers & Geometric Bands -->
    <!-- Top Cap (Alool roof layer) -->
    <path d="M 125,120 Q 200,105 275,120 L 265,145 Q 200,132 135,145 Z" fill="#DC2626" stroke="#991B1B" stroke-width="1.5"/>
    <!-- Chevron embroidery pattern on top band -->
    <path d="M 140,132 L 148,122 L 156,132 L 164,122 L 172,132 L 180,122 L 188,132 L 196,122 L 204,132 L 212,122 L 220,132 L 228,122 L 236,132 L 244,122 L 252,132 L 260,122" 
          stroke="#FEF08A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

    <!-- Middle Woven Band (Warm Ochre / Orange) -->
    <path d="M 92,165 Q 200,145 308,165 L 300,192 Q 200,172 100,192 Z" fill="#EA580C" stroke="#9A3412" stroke-width="1.5"/>
    <!-- Diamond textile weave markings -->
    <g stroke="#FED7AA" stroke-width="1.5" opacity="0.85">
      <path d="M 115,178 L 125,168 L 135,178 L 125,188 Z" fill="#9A3412"/>
      <path d="M 155,178 L 165,168 L 175,178 L 165,188 Z" fill="#9A3412"/>
      <path d="M 195,178 L 205,168 L 215,178 L 205,188 Z" fill="#9A3412"/>
      <path d="M 235,178 L 245,168 L 255,178 L 245,188 Z" fill="#9A3412"/>
      <path d="M 275,178 L 285,168 L 295,178 L 285,188 Z" fill="#9A3412"/>
    </g>

    <!-- Lower Woven Mat Skirt (Earthy textured straw / Grass weave) -->
    <path d="M 72,212 Q 200,190 328,212 L 325,248 Q 200,230 75,248 Z" fill="#D97706" opacity="0.9"/>

    <!-- Vertical Weave Stitch Lines (Showing handmade grass reed craft) -->
    <path d="M 80,215 L 82,248 M 95,213 L 97,248 M 110,210 L 112,248 M 125,208 L 127,248 M 140,205 L 142,248 M 260,205 L 258,248 M 275,208 L 273,248 M 290,210 L 288,248 M 305,213 L 303,248 M 320,215 L 318,248" 
          stroke="#78350F" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>

    <!-- EXTERIOR STRUCTURAL ROPES (Heavy braided nomadic transport cords securing the dome) -->
    <path d="M 80,248 Q 145,130 200,75" stroke="#78350F" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M 320,248 Q 255,130 200,75" stroke="#78350F" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M 120,248 Q 165,110 200,75" stroke="#92400E" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <path d="M 280,248 Q 235,110 200,75" stroke="#92400E" stroke-width="2.5" stroke-linecap="round" fill="none"/>

    <!-- ARCHED ENTRANCE DOORWAY -->
    <!-- Wooden Doorway Arch Frame (Carved acacia branch) -->
    <path d="M 160,248 C 160,185 240,185 240,248 Z" fill="url(#doorInterior)" stroke="#78350F" stroke-width="4"/>

    <!-- Interior Warm Hearth Glow inside the aqal -->
    <ellipse cx="200" cy="240" rx="22" ry="12" fill="#F59E0B" opacity="0.8"/>
    <ellipse cx="200" cy="240" rx="12" ry="6" fill="#FEF08A"/>

    <!-- Rolled Woven Door Screen (Alool door curtain held up with leather straps) -->
    <rect x="156" y="180" width="88" height="16" rx="6" fill="#D97706" stroke="#451A03" stroke-width="2"/>
    <!-- Leather tie straps -->
    <rect x="175" y="176" width="6" height="24" rx="2" fill="#78350F"/>
    <rect x="219" y="176" width="6" height="24" rx="2" fill="#78350F"/>

    <!-- Traditional Woven Milk Vessel (Dhiil) resting outside doorway -->
    <path d="M 262,252 C 255,242 258,230 268,222 C 274,218 276,212 276,206 L 282,206 C 282,212 284,218 290,222 C 300,230 303,242 296,252 Z" 
          fill="#92400E" stroke="#451A03" stroke-width="1.5"/>
    <ellipse cx="279" cy="206" rx="4" ry="2" fill="#FDE047"/>
    <!-- Shell/bead strap -->
    <path d="M 276,220 Q 279,240 282,220" stroke="#FEF3C7" stroke-width="1.5" stroke-linecap="round" fill="none"/>
  </g>
</svg>