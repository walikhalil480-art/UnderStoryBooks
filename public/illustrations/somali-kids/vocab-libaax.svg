<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" width="100%" height="100%">
  <defs>
    <!-- Background Savanna Glow -->
    <radialGradient id="lionSky" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FEF3C7" stop-opacity="0.95"/>
      <stop offset="65%" stop-color="#FED7AA" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#F4EFE6" stop-opacity="0"/>
    </radialGradient>

    <!-- Golden Tawny Coat -->
    <linearGradient id="lionCoat" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="40%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>

    <!-- Majestic Amber-Brown Mane -->
    <linearGradient id="lionMane" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B45309"/>
      <stop offset="40%" stop-color="#78350F"/>
      <stop offset="80%" stop-color="#451A03"/>
      <stop offset="100%" stop-color="#1E0E04"/>
    </linearGradient>

    <filter id="lionShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#451A03" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Savanna Backdrop -->
  <ellipse cx="200" cy="160" rx="165" ry="115" fill="url(#lionSky)"/>

  <!-- Distant Kopje Rocks -->
  <ellipse cx="200" cy="270" rx="145" ry="24" fill="#E2CBB0"/>
  <ellipse cx="200" cy="265" rx="120" ry="18" fill="#78350F" opacity="0.3"/>

  <!-- MAJESTIC SOMALI LION (LIBAAXA BOQORKA AH) -->
  <g filter="url(#lionShadow)">
    <!-- Lion Body (Noble Resting/Sitting Pose) -->
    <path d="M 120,245 C 105,215 130,175 160,165 C 190,155 230,160 250,185 C 270,210 265,245 240,255 Z" fill="url(#lionCoat)"/>

    <!-- Lion Front Paws (Mighty Paws Extended Forward) -->
    <path d="M 160,240 L 155,268 L 195,268 L 190,240 Z" fill="url(#lionCoat)"/>
    <path d="M 210,240 L 205,268 L 245,268 L 240,240 Z" fill="url(#lionCoat)"/>
    <!-- Claws/Paws Indentations -->
    <ellipse cx="175" cy="266" rx="16" ry="6" fill="#FDE68A"/>
    <line x1="168" y1="264" x2="168" y2="271" stroke="#92400E" stroke-width="1.5"/>
    <line x1="182" y1="264" x2="182" y2="271" stroke="#92400E" stroke-width="1.5"/>

    <ellipse cx="225" cy="266" rx="16" ry="6" fill="#FDE68A"/>
    <line x1="218" y1="264" x2="218" y2="271" stroke="#92400E" stroke-width="1.5"/>
    <line x1="232" y1="264" x2="232" y2="271" stroke="#92400E" stroke-width="1.5"/>

    <!-- Tail with Black Tuft Resting on Rock -->
    <path d="M 120,230 Q 90,240 85,258" stroke="#D97706" stroke-width="6" fill="none" stroke-linecap="round"/>
    <ellipse cx="82" cy="260" rx="9" ry="6" fill="#1E0E04"/>

    <!-- FULL VOLUMINOUS LION MANE -->
    <!-- Outer Mane Ruff -->
    <path d="M 200,60
             C 240,55 275,85 270,135
             C 265,185 235,215 200,210
             C 165,215 135,185 130,135
             C 125,85 160,55 200,60 Z"
          fill="url(#lionMane)"/>

    <!-- Textured Mane Locks Cascading -->
    <path d="M 170,85 Q 160,115 145,135" stroke="#F59E0B" stroke-width="3" stroke-linecap="round"/>
    <path d="M 230,85 Q 240,115 255,135" stroke="#F59E0B" stroke-width="3" stroke-linecap="round"/>
    <path d="M 155,145 Q 150,180 165,200" stroke="#F59E0B" stroke-width="3" stroke-linecap="round"/>
    <path d="M 245,145 Q 250,180 235,200" stroke="#F59E0B" stroke-width="3" stroke-linecap="round"/>
    <path d="M 200,165 L 200,205" stroke="#F59E0B" stroke-width="3" stroke-linecap="round"/>

    <!-- Rounded Ears Peeking from Mane -->
    <circle cx="160" cy="85" r="14" fill="#B45309"/>
    <circle cx="160" cy="85" r="9" fill="#FDE68A"/>
    <circle cx="240" cy="85" r="14" fill="#B45309"/>
    <circle cx="240" cy="85" r="9" fill="#FDE68A"/>

    <!-- Noble Lion Face & Forehead -->
    <ellipse cx="200" cy="130" rx="38" ry="36" fill="url(#lionCoat)"/>

    <!-- Golden Amber Eyes with Intense Regal Expression -->
    <polygon points="175,115 188,110 188,122 175,120" fill="#FEF08A"/>
    <circle cx="183" cy="116" r="3" fill="#0F172A"/>
    <circle cx="182" cy="115" r="1" fill="#FFFFFF"/>

    <polygon points="225,115 212,110 212,122 225,120" fill="#FEF08A"/>
    <circle cx="217" cy="116" r="3" fill="#0F172A"/>
    <circle cx="218" cy="115" r="1" fill="#FFFFFF"/>

    <!-- Dark Nose Bridge & Majestic Black Snout -->
    <path d="M 193,122 L 193,138 L 190,144 L 210,144 L 207,138 L 207,122 Z" fill="#92400E"/>
    <!-- Triangular Black Nose Pad -->
    <polygon points="190,144 210,144 200,154" fill="#1E0E04"/>

    <!-- White Muzzle Pads with Whiskers -->
    <ellipse cx="190" cy="158" rx="12" ry="8" fill="#FEF3C7"/>
    <ellipse cx="210" cy="158" rx="12" ry="8" fill="#FEF3C7"/>
    <!-- Whisker Dots & Fine Whiskers -->
    <circle cx="187" cy="156" r="1" fill="#78350F"/>
    <circle cx="191" cy="160" r="1" fill="#78350F"/>
    <circle cx="209" cy="160" r="1" fill="#78350F"/>
    <circle cx="213" cy="156" r="1" fill="#78350F"/>
    <path d="M 184,156 Q 165,152 145,158" stroke="#CBD5E1" stroke-width="1.2" fill="none"/>
    <path d="M 184,160 Q 165,162 148,168" stroke="#CBD5E1" stroke-width="1.2" fill="none"/>
    <path d="M 216,156 Q 235,152 255,158" stroke="#CBD5E1" stroke-width="1.2" fill="none"/>
    <path d="M 216,160 Q 235,162 252,168" stroke="#CBD5E1" stroke-width="1.2" fill="none"/>

    <!-- Chin Beard Tuft -->
    <path d="M 194,164 Q 200,178 206,164" fill="#FEF3C7"/>
  </g>

  <!-- Golden Savanna Sparkles -->
  <g fill="#F59E0B">
    <path d="M 320,65 Q 326,65 326,59 Q 326,65 332,65 Q 326,65 326,71 Q 326,65 320,65 Z"/>
    <path d="M 75,85 Q 80,85 80,80 Q 80,85 85,85 Q 80,85 80,90 Q 80,85 75,85 Z" opacity="0.8"/>
  </g>
</svg>