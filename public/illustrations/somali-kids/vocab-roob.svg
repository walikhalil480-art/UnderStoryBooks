<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" width="100%" height="100%">
  <defs>
    <!-- Sky Gradient -->
    <linearGradient id="rainSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E0F2FE"/>
      <stop offset="50%" stop-color="#BAE6FD"/>
      <stop offset="100%" stop-color="#F0FDF4"/>
    </linearGradient>

    <!-- Cloud Soft Gradient -->
    <linearGradient id="cloudGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>

    <!-- Raindrop Gradient -->
    <linearGradient id="dropGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>

    <!-- Green Somali Guga Hills -->
    <linearGradient id="hillGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="50%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="cloudShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#334155" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Sky Backdrop -->
  <rect width="400" height="320" rx="16" fill="url(#rainSky)"/>

  <!-- Golden Sun Peeking Behind Cloud -->
  <circle cx="280" cy="70" r="34" fill="#F59E0B" opacity="0.8"/>
  <circle cx="280" cy="70" r="26" fill="#FDE68A"/>

  <!-- Rainbow Arc in Distance -->
  <g opacity="0.45" stroke-width="3" fill="none">
    <path d="M 60,220 A 140,140 0 0 1 340,220" stroke="#EF4444"/>
    <path d="M 64,220 A 136,136 0 0 1 336,220" stroke="#F59E0B"/>
    <path d="M 68,220 A 132,132 0 0 1 332,220" stroke="#10B981"/>
    <path d="M 72,220 A 128,128 0 0 1 328,220" stroke="#3B82F6"/>
  </g>

  <!-- Distant Rolling Green Somali Hills (Xilliga Guga) -->
  <path d="M -20,230 Q 80,195 180,215 Q 280,190 420,225 L 420,320 L -20,320 Z" fill="#6EE7B7" opacity="0.6"/>
  <path d="M -10,250 Q 110,225 240,240 Q 340,225 420,255 L 420,320 L -10,320 Z" fill="url(#hillGrad)"/>

  <!-- Flourishing Acacia Trees on Hills -->
  <g transform="translate(60, 195) scale(0.65)">
    <path d="M 30,70 L 32,35 L 18,18 M 32,38 L 48,16" stroke="#5C4738" stroke-width="5" stroke-linecap="round"/>
    <ellipse cx="18" cy="14" rx="24" ry="8" fill="#065F46"/>
    <ellipse cx="48" cy="12" rx="28" ry="9" fill="#047857"/>
  </g>

  <g transform="translate(310, 205) scale(0.55)">
    <path d="M 30,70 L 32,35 L 18,18 M 32,38 L 48,16" stroke="#5C4738" stroke-width="5" stroke-linecap="round"/>
    <ellipse cx="18" cy="14" rx="24" ry="8" fill="#065F46"/>
    <ellipse cx="48" cy="12" rx="28" ry="9" fill="#047857"/>
  </g>

  <!-- MAIN BILLOWING RAIN CLOUD (Filtered with Shadow) -->
  <g filter="url(#cloudShadow)">
    <path d="M 120,135
             A 35,35 0 0,1 155,90
             A 48,48 0 0,1 235,75
             A 42,42 0 0,1 290,115
             A 32,32 0 0,1 280,150
             L 120,150 Z"
          fill="url(#cloudGrad)" stroke="#CBD5E1" stroke-width="1.5"/>

    <!-- Cloud Volume Highlights -->
    <ellipse cx="185" cy="100" rx="26" ry="16" fill="#FFFFFF" opacity="0.7"/>
    <ellipse cx="235" cy="95" rx="20" ry="12" fill="#FFFFFF" opacity="0.6"/>
    <ellipse cx="140" cy="122" rx="18" ry="10" fill="#FFFFFF" opacity="0.5"/>
  </g>

  <!-- GLISTENING TEARDROP RAINDROPS FALLING -->
  <g fill="url(#dropGrad)">
    <!-- Column 1 -->
    <path d="M 130,170 C 130,170 125,178 125,182 A 5,5 0 0,0 135,182 C 135,178 130,170 130,170 Z"/>
    <path d="M 134,205 C 134,205 130,212 130,215 A 4,4 0 0,0 138,215 C 138,212 134,205 134,205 Z" opacity="0.85"/>

    <!-- Column 2 -->
    <path d="M 160,165 C 160,165 154,174 154,178 A 6,6 0 0,0 166,178 C 166,174 160,165 160,165 Z"/>
    <path d="M 165,198 C 165,198 160,206 160,209 A 5,5 0 0,0 170,209 C 170,206 165,198 165,198 Z"/>

    <!-- Column 3 -->
    <path d="M 195,172 C 195,172 190,180 190,183 A 5,5 0 0,0 200,183 C 200,180 195,172 195,172 Z"/>
    <path d="M 198,210 C 198,210 193,217 193,220 A 5,5 0 0,0 203,220 C 203,217 198,210 198,210 Z"/>

    <!-- Column 4 -->
    <path d="M 230,166 C 230,166 224,175 224,179 A 6,6 0 0,0 236,179 C 236,175 230,166 230,166 Z"/>
    <path d="M 235,202 C 235,202 230,209 230,212 A 5,5 0 0,0 240,212 C 240,209 235,202 235,202 Z"/>

    <!-- Column 5 -->
    <path d="M 265,175 C 265,175 260,183 260,186 A 5,5 0 0,0 270,186 C 270,183 265,175 265,175 Z"/>
    <path d="M 268,212 C 268,212 264,218 264,221 A 4,4 0 0,0 272,221 C 272,218 268,212 268,212 Z" opacity="0.8"/>
  </g>

  <!-- Ripples on Ground Grass -->
  <ellipse cx="160" cy="245" rx="12" ry="4" fill="none" stroke="#38BDF8" stroke-width="1.5" opacity="0.75"/>
  <ellipse cx="230" cy="252" rx="10" ry="3" fill="none" stroke="#38BDF8" stroke-width="1.5" opacity="0.75"/>

  <!-- Bright Golden Sunshine Sparkle on Fresh Rain -->
  <g fill="#F59E0B">
    <path d="M 330,60 Q 336,60 336,54 Q 336,60 342,60 Q 336,60 336,66 Q 336,60 330,60 Z"/>
    <path d="M 70,80 Q 75,80 75,75 Q 75,80 80,80 Q 75,80 75,85 Q 75,80 70,80 Z" opacity="0.8"/>
  </g>
</svg>