<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" width="100%" height="100%">
  <defs>
    <!-- Background warm study glow -->
    <radialGradient id="clockBgGlow" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#FEF3C7" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#FFFBEB" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#FFFBEB" stop-opacity="0"/>
    </radialGradient>

    <!-- Polished Gold / Brass Outer Bezel Rim -->
    <linearGradient id="goldBezel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="25%" stop-color="#F59E0B"/>
      <stop offset="50%" stop-color="#B45309"/>
      <stop offset="75%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#78350F"/>
    </linearGradient>

    <!-- Watch Dial Enamel Face -->
    <radialGradient id="dialEnamel" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="70%" stop-color="#FAF7F2"/>
      <stop offset="100%" stop-color="#E2D9C8"/>
    </radialGradient>

    <!-- Glass Crystal Sheen Highlight -->
    <linearGradient id="crystalSheen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.6"/>
      <stop offset="40%" stop-color="#FFFFFF" stop-opacity="0.1"/>
      <stop offset="60%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="85%" stop-color="#FFFFFF" stop-opacity="0.25"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="clockShadow" x="-15%" y="-15%" width="130%" height="135%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#78350F" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Ambient Light -->
  <ellipse cx="200" cy="160" rx="170" ry="110" fill="url(#clockBgGlow)"/>

  <!-- Desktop Surface Shadow -->
  <ellipse cx="200" cy="272" rx="145" ry="22" fill="#FDE68A" opacity="0.6"/>
  <ellipse cx="200" cy="275" rx="130" ry="16" fill="#78350F" opacity="0.2"/>

  <!-- CLOCK (SAACAD) (Filtered) -->
  <g filter="url(#clockShadow)">
    <!-- Top Bell / Ring Loop (Classic antique carriage/alarm style) -->
    <path d="M 175,45 C 175,25 225,25 225,45" stroke="url(#goldBezel)" stroke-width="6" stroke-linecap="round" fill="none"/>
    <rect x="195" y="42" width="10" height="12" rx="2" fill="url(#goldBezel)"/>

    <!-- Clock Brass Pedestal Stand Feet -->
    <path d="M 125,245 L 110,270 L 132,270 L 140,248 Z" fill="url(#goldBezel)" stroke="#78350F" stroke-width="1.5"/>
    <path d="M 275,245 L 290,270 L 268,270 L 260,248 Z" fill="url(#goldBezel)" stroke="#78350F" stroke-width="1.5"/>

    <!-- Outer Heavy Brass Bezel Rim -->
    <circle cx="200" cy="155" r="95" fill="url(#goldBezel)" stroke="#451A03" stroke-width="2"/>
    <!-- Inner Stepped Brass Ring -->
    <circle cx="200" cy="155" r="86" fill="#78350F"/>
    <circle cx="200" cy="155" r="82" fill="url(#dialEnamel)" stroke="#B45309" stroke-width="1.5"/>

    <!-- MINUTE & HOUR TICK TRACK (Fine luxury dial) -->
    <!-- Minute Dots (Every 5 minutes) -->
    <g fill="#451A03">
      <!-- 12 --> <circle cx="200" cy="85" r="3"/>
      <!-- 1 -->  <circle cx="235" cy="94" r="2"/>
      <!-- 2 -->  <circle cx="261" cy="120" r="2"/>
      <!-- 3 -->  <circle cx="270" cy="155" r="3"/>
      <!-- 4 -->  <circle cx="261" cy="190" r="2"/>
      <!-- 5 -->  <circle cx="235" cy="216" r="2"/>
      <!-- 6 -->  <circle cx="200" cy="225" r="3"/>
      <!-- 7 -->  <circle cx="165" cy="216" r="2"/>
      <!-- 8 -->  <circle cx="139" cy="190" r="2"/>
      <!-- 9 -->  <circle cx="130" cy="155" r="3"/>
      <!-- 10 --> <circle cx="139" cy="120" r="2"/>
      <!-- 11 --> <circle cx="165" cy="94" r="2"/>
    </g>

    <!-- NUMERAL LABELS (Clear, elegant Roman/Arabic design) -->
    <g font-family="sans-serif" font-weight="bold" font-size="14" fill="#1E293B" text-anchor="middle" dominant-baseline="central">
      <text x="200" y="98">12</text>
      <text x="255" y="155">3</text>
      <text x="200" y="212">6</text>
      <text x="145" y="155">9</text>
    </g>

    <!-- Sub-text on Dial: eBaro -->
    <text x="200" y="128" font-family="sans-serif" font-weight="700" font-size="9" fill="#94A3B8" text-anchor="middle" letter-spacing="1">eBaro</text>

    <!-- CLOCK HANDS (Pointing to 10:10 — the classic welcoming smile time) -->
    <!-- Hour Hand (Ornamental spade pointer) -->
    <g transform="translate(200, 155) rotate(-60)">
      <polygon points="-3,0 -1,-45 0,-52 1,-45 3,0" fill="#0F172A"/>
      <circle cx="0" cy="-35" r="4.5" fill="#0F172A"/>
      <circle cx="0" cy="-35" r="2" fill="#FFFFFF"/>
    </g>

    <!-- Minute Hand (Longer elegant tapered pointer) -->
    <g transform="translate(200, 155) rotate(60)">
      <polygon points="-2.5,0 -1,-68 0,-74 1,-68 2.5,0" fill="#0F172A"/>
      <circle cx="0" cy="-52" r="4.5" fill="#0F172A"/>
      <circle cx="0" cy="-52" r="2" fill="#FFFFFF"/>
    </g>

    <!-- Second Hand (Vibrant Red slim needle with tail counterbalance) -->
    <g transform="translate(200, 155) rotate(165)">
      <line x1="0" y1="18" x2="0" y2="-76" stroke="#EF4444" stroke-width="1.5" stroke-linecap="round"/>
      <circle cx="0" cy="12" r="3" fill="#EF4444"/>
    </g>

    <!-- Center Brass Hand Cap / Pinion Pivot -->
    <circle cx="200" cy="155" r="5" fill="#F59E0B" stroke="#78350F" stroke-width="1.5"/>
    <circle cx="200" cy="155" r="2" fill="#0F172A"/>

    <!-- Curved Glass Bevel Highlight (Reflecting soft ambient light) -->
    <path d="M 125,120 C 140,85 180,75 225,80 C 185,82 145,100 130,135 Z" fill="url(#crystalSheen)"/>
  </g>
</svg>